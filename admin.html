<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>로아뷰 | 관리자 페이지</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Segoe UI","Malgun Gothic",sans-serif;background:linear-gradient(135deg,#0b1018 0%,#0d1320 45%,#121927 100%);color:#f3ead6;display:flex;align-items:center;justify-content:center}
.admin-clock{position:fixed;top:16px;right:20px;text-align:right;z-index:999;background:rgba(13,18,30,.85);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 16px}
.clock-date{font-size:11px;color:#7fc6ff;font-weight:900;letter-spacing:1px}
.clock-time{font-size:22px;font-weight:900;color:#fff;letter-spacing:2px}
.lock-screen{text-align:center;padding:40px;border-radius:26px;background:linear-gradient(180deg,rgba(20,26,40,.98),rgba(13,18,30,.98));border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 80px rgba(0,0,0,.45);width:min(400px,90%)}
.lock-icon{font-size:48px;margin-bottom:16px}
.lock-title{font-size:24px;font-weight:900;color:#fff;margin-bottom:6px}
.lock-sub{font-size:13px;color:#7a8da8;margin-bottom:24px}
.lock-input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-size:18px;font-weight:900;text-align:center;outline:none;letter-spacing:4px;margin-bottom:14px}
.lock-btn{width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,#7a8cff,#4bd3ff);color:#08111e;font-size:16px;font-weight:900}
.lock-error{color:#ff8f8f;font-size:13px;margin-top:10px;display:none}
.admin-page{display:none;width:100%;min-height:100vh;padding:24px;align-items:flex-start;justify-content:center}
.admin-page.show{display:flex}
.admin-wrap{width:min(1680px,100%);padding-top:70px}
.admin-header{text-align:center;margin-bottom:22px;padding:22px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08)}
.admin-header-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#7fc6ff;margin-bottom:8px;font-weight:900}
.admin-header-title{font-size:28px;font-weight:900;color:#fff}
.admin-header-sub{font-size:13px;color:#7a8da8;margin-top:6px}
.triple-layout{display:grid;grid-template-columns:minmax(300px,1.15fr) minmax(260px,.9fr) minmax(260px,.9fr);gap:14px;align-items:start}
@media(max-width:1200px){.triple-layout{grid-template-columns:1fr}}
.admin-card{border-radius:20px;padding:16px;background:linear-gradient(180deg,rgba(20,26,40,.98),rgba(13,18,30,.98));border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 36px rgba(0,0,0,.28);min-height:180px}
.col-rate{border-color:rgba(62,220,125,.25)}
.col-char{border-color:rgba(255,180,60,.3)}
.col-inq{border-color:rgba(100,160,255,.3)}
.col-label{display:inline-block;font-size:10px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;padding:3px 10px;border-radius:999px;margin-bottom:12px}
.col-rate .col-label{background:rgba(62,220,125,.14);color:#8ef0c9}
.col-char .col-label{background:rgba(255,180,60,.14);color:#ffd48a}
.col-inq .col-label{background:rgba(100,160,255,.14);color:#9ec5ff}
.main-tabs{display:flex;gap:3px;padding:3px;margin-bottom:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:11px}
.main-tab{flex:1;padding:9px 6px;border:none;border-radius:9px;background:none;color:#5a6a82;font-size:12px;font-weight:900;cursor:pointer}
.main-tab.active{background:linear-gradient(135deg,#7a8cff,#4bd3ff);color:#08111e}
.period-bar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.period-btn{padding:5px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#5a6a82;font-size:11px;font-weight:900;cursor:pointer}
.period-btn.active{background:linear-gradient(135deg,#7a8cff,#4bd3ff);color:#08111e;border-color:transparent}
.custom-range{display:none;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.custom-range.show{display:flex}
.custom-range input[type=date]{padding:5px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-size:11px}
.custom-range button{padding:5px 10px;border-radius:8px;border:none;cursor:pointer;background:linear-gradient(135deg,#7a8cff,#4bd3ff);color:#08111e;font-size:11px;font-weight:900}
.champ-type-toggle{display:none;gap:3px;margin-bottom:10px;width:fit-content;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:3px}
.champ-type-toggle.show{display:flex}
.champ-type-btn{padding:5px 12px;border:none;border-radius:8px;background:none;color:#5a6a82;font-size:11px;font-weight:900;cursor:pointer}
.champ-type-btn.active{background:linear-gradient(135deg,#7a8cff,#4bd3ff);color:#08111e}
.card-title{font-size:14px;font-weight:900;color:#fff;margin-bottom:10px}
.card-title-sub{font-size:11px;color:#7a8da8;font-weight:700;margin-left:6px}
.rate-table{width:100%;border-collapse:collapse}
.rate-table th{font-size:10px;color:#5a6a82;font-weight:900;padding:6px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left}
.rate-table td{padding:7px 6px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.rank-num{font-size:12px;font-weight:900;color:#5a6a82}
.rank-num.top1{color:#ffd700}.rank-num.top2{color:#c0c0c0}.rank-num.top3{color:#cd7f32}
.eng-name{font-weight:900;color:#fff;font-size:12px}
.cls-name{font-size:10px;color:#7a8da8;margin-top:1px}
.rate-bar-wrap{display:flex;align-items:center;gap:6px}
.rate-bar{flex:1;height:5px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;min-width:36px}
.rate-fill{height:100%;border-radius:999px}
.fill-op{background:linear-gradient(90deg,#3edc7d,#6ff0b7)}
.fill-favor{background:linear-gradient(90deg,#ffac55,#ffd48a)}
.rate-val{font-size:12px;font-weight:900;color:#fff;min-width:40px;text-align:right}
.record-text{font-size:10px;color:#5a6a82;margin-top:2px}
.champ-badge{display:inline-flex;align-items:center;gap:3px;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.22);border-radius:7px;padding:2px 7px;font-size:11px;font-weight:900;color:#ffd700}
.loading-text{text-align:center;color:#5a6a82;font-size:13px;padding:20px 0}


.char-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px}
.char-period-bar{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.char-period-btn{padding:5px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#5a6a82;font-size:11px;font-weight:900;cursor:pointer}
.char-period-btn.active{background:linear-gradient(135deg,#ffb347,#ffd48a);color:#1a1208;border-color:transparent}
.char-refresh-btn{padding:5px 10px;border-radius:8px;border:1px solid rgba(255,180,60,.25);background:rgba(255,180,60,.1);color:#ffd48a;font-size:11px;font-weight:900;cursor:pointer;white-space:nowrap}
.char-refresh-btn:hover{background:rgba(255,180,60,.18)}
.char-custom-range{display:none;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.char-custom-range.show{display:flex}
.char-custom-range input[type=date]{padding:5px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-size:11px}
.char-custom-range button{padding:5px 10px;border-radius:8px;border:none;cursor:pointer;background:linear-gradient(135deg,#ffb347,#ffd48a);color:#1a1208;font-size:11px;font-weight:900}

.char-summary{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.char-sum-box{border-radius:10px;padding:8px 10px;background:rgba(255,180,60,.06);border:1px solid rgba(255,180,60,.14)}
.char-sum-label{font-size:9px;color:#7a8da8;font-weight:800;text-transform:uppercase;margin-bottom:3px}
.char-sum-value{font-size:16px;font-weight:900;color:#ffd48a}
.char-hour-wrap{margin-bottom:12px}
.char-hour-title{font-size:11px;font-weight:900;color:#7fc6ff;margin-bottom:6px;letter-spacing:.5px}
.char-hour-bars{display:flex;align-items:flex-end;gap:2px;height:56px;padding:4px 2px;background:rgba(0,0,0,.2);border-radius:8px}
.char-hour-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.char-hour-bar{width:100%;max-width:12px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#ffd48a,#ff9f43);min-height:2px}
.char-hour-lbl{font-size:8px;color:#5a6a82;margin-top:2px;transform:scale(.9)}
.char-list-title{font-size:11px;font-weight:900;color:#7fc6ff;margin:8px 0 6px;letter-spacing:.5px}
.char-list{display:flex;flex-direction:column;gap:4px;max-height:340px;overflow-y:auto}
.char-row{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
.char-row-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.char-row-name{font-size:13px;font-weight:900;color:#fff}
.char-row-count{font-size:12px;font-weight:900;color:#ffd48a;white-space:nowrap}
.char-row-meta{font-size:10px;color:#5a6a82;margin-top:3px}
.char-row-tabs{font-size:10px;color:#9aa8bc;margin-top:4px;line-height:1.4}
.char-row-tabs b{color:#ffd48a;font-weight:800}
.char-group{display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:12px;border:1.5px solid rgba(255,180,60,.45);background:rgba(255,180,60,.05)}
.char-group-head{font-size:10px;font-weight:900;color:#ffd48a;padding:2px 4px 4px;letter-spacing:.3px}
.char-placeholder{border-radius:14px;padding:28px 16px;text-align:center;background:rgba(255,180,60,.04);border:1px dashed rgba(255,180,60,.28)}

.char-placeholder-ico{font-size:36px;margin-bottom:10px}
.char-placeholder-title{font-size:15px;font-weight:900;color:#ffd48a;margin-bottom:6px}
.char-placeholder-desc{font-size:12px;color:#7a8da8;line-height:1.6}
.char-placeholder-list{margin-top:14px;text-align:left;font-size:12px;color:#9aa8bc;line-height:1.8;padding:12px;border-radius:10px;background:rgba(0,0,0,.2)}
.char-placeholder-list b{color:#ffd48a}
.inq-admin-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.inq-summary-box{border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
.inq-summary-label{font-size:9px;color:#7a8da8;margin-bottom:3px;font-weight:800;text-transform:uppercase}
.inq-summary-value{font-size:16px;font-weight:900;color:#fff}
.inq-admin-list{display:grid;gap:5px;margin-bottom:10px;max-height:280px;overflow-y:auto}
.inq-admin-item{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:10px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);cursor:pointer}
.inq-admin-item:hover{background:rgba(255,255,255,.045)}
.inq-admin-item.active{background:rgba(160,120,255,.08);border-color:rgba(160,120,255,.18)}
.inq-admin-no{font-size:11px;font-weight:900;color:#5a6a82;text-align:center}
.inq-admin-title{font-size:12px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inq-admin-meta{margin-top:2px;display:flex;gap:4px;flex-wrap:wrap}
.inq-admin-badge-secret{padding:2px 5px;border-radius:5px;font-size:9px;font-weight:900;background:rgba(160,120,255,.14);color:#d8b4fe}
.inq-admin-badge-type{padding:2px 5px;border-radius:5px;font-size:9px;font-weight:900;background:rgba(255,196,90,.12);color:#ffd48a}
.inq-admin-date{font-size:9px;color:#5a6a82}
.inq-admin-badge-status{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:900}
.inq-admin-badge-status.wait{background:rgba(255,196,90,.1);color:#ffd48a;border:1px solid rgba(255,196,90,.18)}
.inq-admin-badge-status.done{background:rgba(62,220,125,.1);color:#8ef0c9;border:1px solid rgba(62,220,125,.18)}
.inq-admin-detail{border-radius:12px;padding:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06)}
.inq-detail-title{font-size:14px;font-weight:900;color:#fff}
.inq-detail-content{margin-top:6px;padding:10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);color:#d7cfee;font-size:12px;line-height:1.65;min-height:64px;white-space:pre-wrap;word-break:break-all}
.inq-reply-box{margin-top:10px}
.inq-reply-label{font-size:10px;font-weight:900;color:#c4b5fd;margin-bottom:5px;text-transform:uppercase}
.inq-reply-textarea{width:100%;min-height:72px;resize:vertical;border-radius:10px;border:1px solid rgba(160,120,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:12px;font-weight:700;padding:10px 12px;outline:none}
.inq-reply-actions{display:flex;gap:6px;margin-top:8px}
.inq-admin-btn{flex:1;padding:8px 10px;border-radius:9px;border:none;font-size:12px;font-weight:900;cursor:pointer}
.inq-admin-btn.primary{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff}
.inq-admin-btn.ghost{background:rgba(255,255,255,.04);color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.08)}
.inq-admin-btn.danger{background:rgba(255,80,80,.08);color:#ff8888;border:1px solid rgba(255,80,80,.25)}
.inq-existing-reply{margin-top:8px;padding:10px;border-radius:10px;background:rgba(62,220,125,.06);border:1px solid rgba(62,220,125,.16)}
.inq-existing-reply-label{font-size:10px;font-weight:900;color:#8ef0c9;margin-bottom:5px}
.inq-existing-reply-text{font-size:12px;color:#d0f0e0;line-height:1.65;white-space:pre-wrap}
.bottom-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:14px;margin-top:14px}
@media(max-width:900px){.bottom-grid{grid-template-columns:1fr}}
.grade-section-title{font-size:12px;font-weight:900;color:#7fc6ff;margin-bottom:10px;letter-spacing:1px;text-transform:uppercase}
.grade-list{display:flex;flex-direction:column;gap:4px;max-height:320px;overflow-y:auto}
.grade-row{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
.grade-name-text{font-size:12px;font-weight:900}
.grade-count{font-size:11px;color:#7a8da8;font-weight:900}
.grade-count span{color:#fff}
.grade-total{font-size:11px;color:#5a6a82;margin-bottom:8px}
.pick-controls{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pick-toggle{display:flex;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:3px;gap:2px}
.pick-toggle-btn{padding:5px 12px;border-radius:8px;border:none;background:none;color:#5a6a82;font-size:11px;font-weight:900;cursor:pointer}
.pick-toggle-btn.active{background:linear-gradient(135deg,#7a8cff,#4bd3ff);color:#08111e}
.pick-select-wrap{flex:1;min-width:120px}
.pick-select{width:100%;padding:6px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-size:12px;font-weight:900}
.pick-result-list{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow-y:auto}
.pick-result-row{display:grid;grid-template-columns:24px 1fr 48px;align-items:center;gap:6px;padding:6px 8px;border-radius:9px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.04)}
.pick-result-row.pick-top1{background:linear-gradient(135deg,rgba(255,215,0,.08),rgba(255,180,60,.04));border-color:rgba(255,215,0,.18)}
.pick-rank{font-size:11px;font-weight:900;color:#5a6a82;text-align:center}
.pick-rank.ptop1{color:#ffd700}
.pick-eng-name{font-size:12px;font-weight:900;color:#fff;margin-bottom:3px}
.pick-bar-bg{width:100%;height:4px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
.pick-bar-fill{height:100%;border-radius:999px}
.pick-bar-op{background:linear-gradient(90deg,#3edc7d,#6ff0b7)}
.pick-bar-favor{background:linear-gradient(90deg,#ffac55,#ffd48a)}
.pick-count-text{font-size:9px;color:#5a6a82;margin-top:2px;font-weight:800}
.pick-rate-val{font-size:12px;font-weight:900;color:#fff;text-align:right}
.pick-summary{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);margin-bottom:8px}
.pick-summary-label{font-size:10px;color:#7fc6ff;font-weight:900;text-transform:uppercase}
.pick-summary-value{font-size:13px;font-weight:900;color:#fff}
.pick-summary-sub{font-size:10px;color:#5a6a82;margin-top:2px}
</style>
</head>
<body>
<div class="admin-clock"><div class="clock-date" id="clockDate"></div><div class="clock-time" id="clockTime"></div></div>
<div class="lock-screen" id="lockScreen">
  <div class="lock-icon">🔐</div>
  <div class="lock-title">관리자 페이지</div>
  <div class="lock-sub">접근 권한이 필요합니다</div>
  <input class="lock-input" type="password" id="pwInput" placeholder="••••" maxlength="20"/>
  <button class="lock-btn" id="pwBtn">확인</button>
  <div class="lock-error" id="pwError">비밀번호가 틀렸습니다 🔒</div>
</div>
<div class="admin-page" id="adminPage">
  <div class="admin-wrap">
    <div class="admin-header">
      <div class="admin-header-label">LOAVIEW · ADMIN</div>
      <div class="admin-header-title">로아뷰 관리자 페이지 🛠️</div>
      <div class="admin-header-sub">각인 승률 · 캐릭터 조회 · 문의 관리</div>
    </div>
    <div class="triple-layout">
      <!-- 초록: 승률 -->
      <div class="admin-card col-rate">
        <span class="col-label">승률 모니터</span>
        <div class="main-tabs" id="mainTabs">
          <button type="button" class="main-tab active" data-tab="op">직각 승률</button>
          <button type="button" class="main-tab" data-tab="favor">호감 승률</button>
          <button type="button" class="main-tab" data-tab="champ">우승 승률</button>
        </div>
        <div id="periodControls">
          <div class="period-bar">
            <button type="button" class="period-btn active" data-days="1">1일</button>
            <button type="button" class="period-btn" data-days="3">3일</button>
            <button type="button" class="period-btn" data-days="7">7일</button>
            <button type="button" class="period-btn" data-days="30">한달</button>
            <button type="button" class="period-btn" data-days="custom">직접 선택</button>
          </div>
          <div class="custom-range" id="customRange">
            <input type="date" id="customFrom"/><span style="color:#5a6a82;font-size:11px">~</span>
            <input type="date" id="customTo"/>
            <button type="button" id="customApply">적용</button>
          </div>
        </div>
        <div class="champ-type-toggle" id="champTypeWrap">
          <button type="button" class="champ-type-btn active" data-type="op">OP</button>
          <button type="button" class="champ-type-btn" data-type="favor">호감</button>
        </div>
        <div class="card-title" id="tableTitle">직각 승률 <span class="card-title-sub">1일 (당일)</span></div>
        <div id="mainTable"><div class="loading-text">불러오는 중...</div></div>
      </div>
      <!-- 주황: 조회 자리 -->
      <div class="admin-card col-char">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px">
          <span class="col-label" style="margin:0">캐릭터 조회</span>
          <button type="button" class="char-refresh-btn" id="charRefreshBtn">↻ 새로고침</button>
        </div>
        <div class="char-toolbar">
          <div class="char-period-bar" id="charPeriodBar">
            <button type="button" class="char-period-btn active" data-range="today">오늘</button>

const TAB_LABEL_MAP = {info:"정보",stat:"스텟",skill:"스킬",arkgrid:"아크그리드",arkpassive:"아크패시브",expedition:"원정대",gakgak:"직각 티어"};

function fmtKst(iso) {
  try {
    return new Date(iso).toLocaleString("ko-KR", {
      timeZone: "Asia/Seoul",
      year: "2-digit", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false
    });
  } catch (e) { return "-"; }
}

function tabsPath(tabs) {
  if (!tabs || !tabs.length) return "-";
  return tabs.map(t => TAB_LABEL_MAP[t] || t).join(" → ");
}


let charRange = "today"; // today | yesterday | 3 | 7 | custom
let charFrom = null;
let charTo = null;

function kstYmd(d) {
  return d.toLocaleDateString("en-CA", { timeZone: "Asia/Seoul" });
}
function kstHour(d) {
  let h = Number(d.toLocaleString("en-US", { timeZone: "Asia/Seoul", hour: "numeric", hour12: false }));
  if (h === 24) h = 0;
  return h;
}
/** 기간 시작/끝 (KST 날짜 문자열 YYYY-MM-DD inclusive) */
function charRangeBounds() {
  const now = new Date();
  const today = kstYmd(now);
  if (charRange === "today") return { from: today, to: today, mode: "hour" };
  if (charRange === "yesterday") {
    const y = new Date(now.getTime() - 24 * 3600 * 1000);
    const ys = kstYmd(y);
    return { from: ys, to: ys, mode: "hour" };
  }
  if (charRange === "3" || charRange === "7") {
    const days = Number(charRange);
    const start = new Date(now.getTime() - (days - 1) * 24 * 3600 * 1000);
    return { from: kstYmd(start), to: today, mode: "day" };
  }
  // custom
  const f = charFrom || today;
  const t = charTo || today;
  const mode = (f === t) ? "hour" : "day";
  return { from: f, to: t, mode: mode };
}

async function loadCharLookup() {
  const listEl = document.getElementById("charLookupList");
  const hourEl = document.getElementById("charHourBars");
  if (!listEl) return;
  listEl.innerHTML = '<div class="loading-text">불러오는 중...</div>';
  if (hourEl) hourEl.innerHTML = '<div class="loading-text" style="width:100%;padding:12px 0">불러오는 중...</div>';

  try {
    const bounds = charRangeBounds();
    // 넉넉히 가져와서 클라이언트에서 KST 필터 (timestamptz)
    let { data: logs, error: e2 } = await supabase
      .from("char_lookup_logs")
      .select("name,created_at,visitor_id")
      .order("created_at", { ascending: false })
      .limit(5000);

    // visitor_id 컬럼이 아직 없으면 예전 방식으로 조회 (묶음 없이 표시)
    if (e2) {
      const r2 = await supabase
        .from("char_lookup_logs")
        .select("name,created_at")
        .order("created_at", { ascending: false })
        .limit(5000);
      logs = r2.data; e2 = r2.error;
    }
    if (e2) throw e2;

    const filtered = [];
    (logs || []).forEach(row => {
      const d = new Date(row.created_at);
      const day = kstYmd(d);
      if (day >= bounds.from && day <= bounds.to) filtered.push({ name: row.name, at: d, day: day, vid: row.visitor_id || null });
    });

    document.getElementById("charTodayCount").textContent = filtered.length;
    document.getElementById("charPeriodLabel").textContent =
      bounds.from === bounds.to ? (bounds.from + " 조회") : (bounds.from + " ~ " + bounds.to);

    // 닉네임별 집계 + tabs는 stats 테이블에서
    const nameCount = {};
    const nameLast = {};
    filtered.forEach(r => {
      nameCount[r.name] = (nameCount[r.name] || 0) + 1;
      if (!nameLast[r.name] || r.at > nameLast[r.name]) nameLast[r.name] = r.at;
    });
    const names = Object.keys(nameCount).sort((a, b) => nameCount[b] - nameCount[a] || (nameLast[b] - nameLast[a]));
    document.getElementById("charNameCount").textContent = names.length;

    const { data: stats } = await supabase
      .from("char_lookup_stats")
      .select("name,tabs,last_seen,count")
      .in("name", names.length ? names.slice(0, 100) : ["__none__"]);

    const tabMap = {};
    (stats || []).forEach(s => { tabMap[s.name] = s.tabs; });

    if (!names.length) {
      listEl.innerHTML = '<div class="loading-text">이 기간에 조회 기록이 없습니다</div>';
    } else {
      // 방문자(visitor_id)별로 묶기. visitor_id 없는 기록은 닉네임 단위로 따로 취급
      const groups = new Map();
      filtered.forEach(r => {
        const key = r.vid ? "v:" + r.vid : "n:" + r.name;
        let g = groups.get(key);
        if (!g) { g = { last: r.at, names: new Map(), total: 0 }; groups.set(key, g); }
        if (r.at > g.last) g.last = r.at;
        g.total++;
        let e = g.names.get(r.name);
        if (!e) { e = { count: 0, last: r.at }; g.names.set(r.name, e); }
        e.count++;
        if (r.at > e.last) e.last = r.at;
      });
      // 방문자 그룹: 가장 최근에 조회한 사람이 맨 위 / 그룹 안에서도 최근 닉네임이 위
      const sortedGroups = Array.from(groups.values()).sort((a, b) => b.last - a.last);

      const rowHtml = (name, e) =>
        '<div class="char-row">'
        + '<div class="char-row-top"><div class="char-row-name">' + name + '</div>'
        + '<div class="char-row-count">' + e.count + '회</div></div>'
        + '<div class="char-row-meta">마지막 ' + fmtKst(e.last.toISOString()) + '</div>'
        + '<div class="char-row-tabs"><b>탭</b> ' + tabsPath(tabMap[name]) + '</div>'
        + '</div>';

      listEl.innerHTML = sortedGroups.map(g => {
        const entries = Array.from(g.names.entries()).sort((a, b) => b[1].last - a[1].last);
        if (entries.length === 1) return rowHtml(entries[0][0], entries[0][1]);
        return '<div class="char-group">'
          + '<div class="char-group-head">👤 한 방문자 · 닉네임 ' + entries.length + '개 · 총 ' + g.total + '회</div>'
          + entries.map(en => rowHtml(en[0], en[1])).join("")
          + '</div>';
      }).join("");
    }

    // 차트
    document.getElementById("charChartTitle").textContent =
      bounds.mode === "hour" ? "시간대 (KST)" : "일별 조회 (KST)";
    hourEl.innerHTML = "";
    if (bounds.mode === "hour") {
      const hourCount = {};
      for (let h = 0; h < 24; h++) hourCount[h] = 0;
      filtered.forEach(r => { hourCount[kstHour(r.at)] = (hourCount[kstHour(r.at)] || 0) + 1; });
      const maxH = Math.max(1, ...Object.values(hourCount));
      for (let h = 0; h < 24; h++) {
        const n = hourCount[h] || 0;
        const pct = Math.max(n ? 8 : 2, Math.round(n / maxH * 100));
        const col = document.createElement("div");
        col.className = "char-hour-col";
        col.title = h + "시 " + n + "회";
        col.innerHTML = '<div class="char-hour-bar" style="height:' + pct + '%;opacity:' + (n ? 1 : .25) + '"></div>'
          + (h % 3 === 0 ? '<div class="char-hour-lbl">' + h + '</div>' : '<div class="char-hour-lbl">&nbsp;</div>');
        hourEl.appendChild(col);
      }
    } else {
      // day bars from from..to
      const days = [];
      const cur = new Date(bounds.from + "T12:00:00+09:00");
      const end = new Date(bounds.to + "T12:00:00+09:00");
      while (cur <= end) {
        days.push(kstYmd(cur));
        cur.setDate(cur.getDate() + 1);
      }
      const dayCount = {};
      days.forEach(d => dayCount[d] = 0);
      filtered.forEach(r => { dayCount[r.day] = (dayCount[r.day] || 0) + 1; });
      const maxD = Math.max(1, ...Object.values(dayCount));
      days.forEach(d => {
        const n = dayCount[d] || 0;
        const pct = Math.max(n ? 8 : 2, Math.round(n / maxD * 100));
        const col = document.createElement("div");
        col.className = "char-hour-col";
        col.title = d + " " + n + "회";
        const label = d.slice(5); // MM-DD
        col.innerHTML = '<div class="char-hour-bar" style="height:' + pct + '%;opacity:' + (n ? 1 : .25) + '"></div>'
          + '<div class="char-hour-lbl">' + label + '</div>';
        hourEl.appendChild(col);
      });
    }
  } catch (err) {
    console.error("loadCharLookup", err);
    listEl.innerHTML = '<div class="loading-text">조회 실패 😢<br><span style="font-size:11px">' + (err && err.message ? err.message : err) + '</span></div>';
    if (hourEl) hourEl.innerHTML = '<div class="loading-text">-</div>';
  }
}

      currentDays=btn.dataset.days==="custom"?"custom":Number(btn.dataset.days);
      if(currentDays==="custom"){
        const iso=new Date().toISOString().slice(0,10);
        if(!document.getElementById("customTo").value) document.getElementById("customTo").value=iso;
        if(!document.getElementById("customFrom").value){const d=new Date();d.setDate(d.getDate()-6);document.getElementById("customFrom").value=d.toISOString().slice(0,10)}
        customFrom=document.getElementById("customFrom").value; customTo=document.getElementById("customTo").value; syncPeriodUI(); return;
      }
      loadMainTable();
    };
  });
  document.getElementById("customApply").onclick=()=>{
    customFrom=document.getElementById("customFrom").value; customTo=document.getElementById("customTo").value;
    if(!customFrom){alert("시작일을 선택하세요");return}
    currentDays="custom"; loadMainTable();
  };
  document.querySelectorAll(".champ-type-btn").forEach(btn=>{
    btn.onclick=()=>{document.querySelectorAll(".champ-type-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");champType=btn.dataset.type;if(currentTab==="champ")loadMainTable()};
  });

  // 클래스 선택 영역은 HTML에 있을 때만 초기화 (없으면 건너뜀)
  const pickSel=document.getElementById("classPickSelect");
  if(pickSel){
    document.querySelectorAll(".pick-toggle-btn").forEach(btn=>{
      btn.onclick=()=>{document.querySelectorAll(".pick-toggle-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");currentPickType=btn.dataset.type;if(pickSel.value)loadClassPickData(pickSel.value,currentPickType)};
    });
    pickSel.onchange=function(){
      const r=document.getElementById("classPickResult");
      if(this.value)loadClassPickData(this.value,currentPickType);
      else if(r)r.innerHTML='<div class="loading-text">클래스를 선택하세요 🎯</div>';
    };
    document.querySelectorAll("#classPickSelect option").forEach(o=>{if(o.value===""&&o.textContent&&!o.textContent.includes("선택"))o.value=o.textContent});
  }

  initCharLookupUI();
  loadMainTable();
  loadCharLookup();
}

async function loadClassPickData(className,type){
  const el=document.getElementById("classPickResult");
  if(!el) return;
  el.innerHTML='<div class="loading-text">불러오는 중...</div>';
  const {data,error}=await supabase.rpc("get_class_winner_stats",{p_class:className,p_type:type});
  if(error||!data||!data.length){el.innerHTML='<div class="loading-text">데이터 없음 😢</div>';return}
  const total=data.reduce((s,r)=>s+Number(r.pick_count),0);
  const bar=type==="op"?"pick-bar-op":"pick-bar-favor";
  el.innerHTML=`<div class="pick-summary"><div><div class="pick-summary-label">${className} · ${type==="op"?"OP":"호감"}</div><div class="pick-summary-sub">총 ${total}명 참여</div></div><div class="pick-summary-value">${data.length}개 직각</div></div>
  <div class="pick-result-list">${data.map((row,i)=>`<div class="pick-result-row ${i===0?"pick-top1":""}"><div class="pick-rank ${i===0?"ptop1":""}">${i+1}</div><div><div class="pick-eng-name">${row.winner_engraving}</div><div class="pick-bar-bg"><div class="pick-bar-fill ${bar}" style="width:${Math.min(100,Number(row.pick_rate))}%"></div></div><div class="pick-count-text">${row.pick_count}명 선택</div></div><div class="pick-rate-val">${Number(row.pick_rate).toFixed(1)}%</div></div>`).join("")}</div>`;
}

async function loadAdminInquiries(){
  if(!adminPw) return;
  const listEl=document.getElementById("inqAdminList");
  listEl.innerHTML='<div class="loading-text">불러오는 중...</div>';
  const result=await supabase.rpc("list_inquiries");
  if(result.error||!result.data||!result.data.length){
    listEl.innerHTML='<div class="loading-text">문의가 없습니다 📭</div>';
    document.getElementById("inqTotalCount").textContent="0";
    document.getElementById("inqWaitingCount").textContent="0";
    document.getElementById("inqDoneCount").textContent="0"; return;
  }
  const rows=result.data;
  document.getElementById("inqTotalCount").textContent=rows.length;
  document.getElementById("inqWaitingCount").textContent=rows.filter(r=>r.status==="대기중").length;
  document.getElementById("inqDoneCount").textContent=rows.filter(r=>r.status==="답변완료").length;
  listEl.innerHTML=rows.map(row=>{
    const dateStr=new Date(row.created_at).toLocaleDateString("ko-KR",{year:"2-digit",month:"2-digit",day:"2-digit"});
    return `<div class="inq-admin-item ${selectedAdminInqId===row.id?"active":""}" data-inq-id="${row.id}">
      <div class="inq-admin-no">#${row.id}</div>
      <div><div class="inq-admin-title">${row.title}</div><div class="inq-admin-meta"><span class="inq-admin-badge-secret">비밀글</span><span class="inq-admin-badge-type">${row.inquiry_type}</span><span class="inq-admin-date">${dateStr}</span></div></div>
      <div class="inq-admin-badge-status ${row.status==="답변완료"?"done":"wait"}">${row.status}</div></div>`;
  }).join("");
}

async function loadAdminInquiryDetail(inqId){
  if(!adminPw) return;
  selectedAdminInqId=inqId;
  const detailEl=document.getElementById("inqAdminDetail");
  detailEl.innerHTML='<div class="loading-text">불러오는 중...</div>';
  const result=await supabase.rpc("admin_read_inquiry",{p_id:inqId,p_admin_pw:adminPw});
  if(result.error||!result.data||!result.data.length){detailEl.innerHTML='<div class="loading-text">문의를 불러올 수 없습니다 😢</div>';return}
  const row=result.data[0];
  const dateStr=new Date(row.created_at).toLocaleDateString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  let existing="";
  if(row.status==="답변완료"&&row.admin_reply){
    const rd=new Date(row.replied_at).toLocaleDateString("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
    existing=`<div class="inq-existing-reply"><div class="inq-existing-reply-label">✅ 기존 답변</div><div class="inq-existing-reply-text">${row.admin_reply}</div><div style="margin-top:5px;font-size:10px;color:#5a8a6a">${rd}</div></div>`;
  }
  detailEl.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:8px"><div><div class="inq-detail-title">#${row.id} ${row.title}</div><div style="margin-top:4px;display:flex;gap:4px"><span class="inq-admin-badge-secret">비밀글</span><span class="inq-admin-badge-type">${row.inquiry_type}</span></div></div><div class="inq-admin-date">${dateStr}</div></div>
  <div class="inq-detail-content">${row.content}</div>${existing}
  <div class="inq-reply-box"><div class="inq-reply-label">${row.status==="답변완료"?"답변 수정":"답변 작성"}</div>
  <textarea class="inq-reply-textarea" id="adminReplyText">${row.admin_reply||""}</textarea>
  <div class="inq-reply-actions">
    <button class="inq-admin-btn danger" id="adminDeleteInqBtn">삭제</button>
    <button class="inq-admin-btn ghost" id="adminResetReplyBtn">초기화</button>
    <button class="inq-admin-btn primary" id="adminSubmitReplyBtn">답변 등록</button>
  </div></div>`;
  document.querySelectorAll(".inq-admin-item").forEach(item=>item.classList.toggle("active",Number(item.dataset.inqId)===inqId));
  document.getElementById("adminSubmitReplyBtn").onclick=async function(){
    const t=document.getElementById("adminReplyText").value.trim(); if(!t){alert("답변 내용을 입력해 주세요.");return}
    this.disabled=true; this.textContent="등록 중...";
    const res=await supabase.rpc("reply_inquiry",{p_id:inqId,p_admin_pw:adminPw,p_reply:t});
    if(res.error||res.data===false){alert("답변 등록 실패");this.disabled=false;this.textContent="답변 등록";return}
    alert("답변이 등록되었습니다."); await loadAdminInquiries(); await loadAdminInquiryDetail(inqId);
  };
  document.getElementById("adminResetReplyBtn").onclick=()=>{document.getElementById("adminReplyText").value=""};
  document.getElementById("adminDeleteInqBtn").onclick=async function(){
    if(!confirm("정말 이 문의를 삭제하시겠습니까?")) return;
    this.disabled=true; this.textContent="삭제 중...";
    const res=await supabase.rpc("admin_delete_inquiry",{p_id:inqId,p_admin_pw:adminPw});
    if(res.error||res.data===false){alert("삭제 실패");this.disabled=false;this.textContent="삭제";return}
    alert("문의가 삭제되었습니다."); selectedAdminInqId=null;
    detailEl.innerHTML='<div class="loading-text">문의글을 선택하면 여기서 확인하고 답변할 수 있습니다.</div>';
    await loadAdminInquiries();
  };
}
document.getElementById("inqAdminList").addEventListener("click",e=>{
  const item=e.target.closest(".inq-admin-item"); if(!item) return;
  loadAdminInquiryDetail(Number(item.dataset.inqId));
});
</script>
</body>
</html>
