
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>직각 토너먼트 밸패 분석</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
    padding: 24px;
    min-height: 100vh;
  }
  .header {
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
  }
  .header p {
    font-size: 13px;
    color: #888;
  }
  .toggle-wrap {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .toggle-btn {
    padding: 8px 20px;
    border-radius: 8px;
    border: 1px solid #444;
    background: transparent;
    color: #aaa;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .toggle-btn.active-op {
    background: #378ADD;
    color: #fff;
    border-color: #378ADD;
  }
  .toggle-btn.active-favor {
    background: #D4537E;
    color: #fff;
    border-color: #D4537E;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: #252540;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .stat-card .label {
    font-size: 12px;
    color: #888;
    margin-bottom: 6px;
  }
  .stat-card .value {
    font-size: 22px;
    font-weight: 700;
  }
  .chart-card {
    background: #252540;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .chart-card h2 {
    font-size: 15px;
    font-weight: 600;
    color: #ccc;
    margin-bottom: 16px;
  }
  .legend {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
    font-size: 12px;
    color: #888;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    display: inline-block;
    margin-right: 4px;
  }
  .chart-wrap {
    position: relative;
    width: 100%;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    padding: 8px 6px;
    color: #888;
    font-weight: 500;
    border-bottom: 1px solid #333;
  }
  td {
    padding: 10px 6px;
    border-bottom: 1px solid #2a2a3e;
    color: #ccc;
  }
  td.right { text-align: right; }
  .up { color: #1D9E75; font-weight: 600; }
  .down { color: #E24B4A; font-weight: 600; }
  .loading {
    text-align: center;
    padding: 40px;
    color: #888;
    font-size: 14px;
  }
  .error {
    text-align: center;
    padding: 40px;
    color: #E24B4A;
    font-size: 14px;
  }
  .rank-num {
    color: #666;
    font-size: 12px;
    margin-right: 4px;
  }
  .period-label {
    font-size: 12px;
    color: #666;
    margin-bottom: 20px;
  }
  @media (max-width: 600px) {
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    body { padding: 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>밸패 이후 떠오르는 직각 분석</h1>
  <p>로아 직각 토너먼트 데이터 기반 · LOITER BASE</p>
</div>

<div class="toggle-wrap">
  <button class="toggle-btn active-op" id="btn-op" onclick="switchType('op')">🔥 OP 토너먼트</button>
  <button class="toggle-btn" id="btn-favor" onclick="switchType('favor')">❤️ 호감 토너먼트</button>
</div>

<div class="period-label">
  📅 비교 기간 &nbsp;|&nbsp; 밸패 전: 2026-04-07 ~ 2026-04-21 &nbsp;/&nbsp; 밸패 후: 2026-04-22 ~ 현재
</div>

<div class="stat-grid">
  <div class="stat-card">
    <div class="label">분석 직각 수</div>
    <div class="value" id="stat-total" style="color:#aaa;">-</div>
  </div>
  <div class="stat-card">
    <div class="label">최대 상승</div>
    <div class="value up" id="stat-up">-</div>
  </div>
  <div class="stat-card">
    <div class="label">최대 하락</div>
    <div class="value down" id="stat-down">-</div>
  </div>
</div>

<div class="chart-card">
  <h2>승률 변화 TOP 10 (밸패 후 기준)</h2>
  <div class="legend">
    <span><span class="legend-dot" style="background:#1D9E75;"></span>밸패 후 승률</span>
    <span><span class="legend-dot" style="background:#555;"></span>밸패 전 승률</span>
  </div>
  <div id="loading-msg" class="loading">데이터 불러오는 중...</div>
  <div id="error-msg" class="error" style="display:none;"></div>
  <div class="chart-wrap" id="chart-wrap" style="display:none;">
    <canvas id="mainChart" role="img" aria-label="밸패 전후 직각 승률 변화 TOP 10"></canvas>
  </div>
</div>

<div class="chart-card" id="table-card" style="display:none;">
  <h2>상세 데이터</h2>
  <table>
    <thead>
      <tr>
        <th style="width:40%;">직각명</th>
        <th class="right" style="width:20%;">밸패 전</th>
        <th class="right" style="width:20%;">밸패 후</th>
        <th class="right" style="width:20%;">변화량</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script>
const SUPABASE_URL = 'https://khszfukekudyripouifm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtoc3pmdWtla3VkeXJpcG91aWZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM4NzMyNjksImV4cCI6MjA1OTQ0OTI2OX0.oCBXBNaHS00yS-JFxnFtlDQBBwIWqBHKMJLO_kuIYSY';

let currentType = 'op';
let chartInstance = null;

async function fetchRange(type, start, end) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_tier_data_range`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`
    },
    body: JSON.stringify({ p_type: type, p_start: start, p_end: end })
  });
  if (!res.ok) throw new Error('API 오류 ' + res.status);
  return res.json();
}

async function loadData(type) {
  document.getElementById('loading-msg').style.display = 'block';
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('chart-wrap').style.display = 'none';
  document.getElementById('table-card').style.display = 'none';
  document.getElementById('stat-total').textContent = '-';
  document.getElementById('stat-up').textContent = '-';
  document.getElementById('stat-down').textContent = '-';

  try {
    const today = new Date().toISOString().split('T')[0];
    const [before, after] = await Promise.all([
      fetchRange(type, '2026-04-07', '2026-04-21'),
      fetchRange(type, '2026-04-22', today)
    ]);

    const beforeMap = {};
    before.forEach(d => { beforeMap[d.engraving_name] = parseFloat(d.win_rate); });

    const combined = after
      .filter(d => beforeMap[d.engraving_name] !== undefined && d.total_matches >= 5)
      .map(d => ({
        name: d.engraving_name,
        before: beforeMap[d.engraving_name],
        after: parseFloat(d.win_rate),
        diff: parseFloat(d.win_rate) - beforeMap[d.engraving_name]
      }))
      .sort((a, b) => b.diff - a.diff);

    const top10 = combined.slice(0, 10);

    document.getElementById('stat-total').textContent = combined.length + '개';
    document.getElementById('stat-up').textContent = top10[0] ? '+' + top10[0].diff.toFixed(1) + '%p' : '-';
    const worst = combined[combined.length - 1];
    document.getElementById('stat-down').textContent = worst ? worst.diff.toFixed(1) + '%p' : '-';

    renderChart(top10);
    renderTable(top10);

    document.getElementById('loading-msg').style.display = 'none';
    document.getElementById('chart-wrap').style.display = 'block';
    document.getElementById('table-card').style.display = 'block';

  } catch(e) {
    document.getElementById('loading-msg').style.display = 'none';
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('error-msg').textContent = '데이터 로딩 실패: ' + e.message;
  }
}

function renderChart(data) {
  const wrap = document.getElementById('chart-wrap');
  wrap.style.height = Math.max(data.length * 48 + 80, 300) + 'px';
  const canvas = document.getElementById('mainChart');
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  chartInstance = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: data.map(d => d.name),
      datasets: [
        {
          label: '밸패 후',
          data: data.map(d => parseFloat(d.after.toFixed(1))),
          backgroundColor: '#1D9E75',
          borderRadius: 4
        },
        {
          label: '밸패 전',
          data: data.map(d => parseFloat(d.before.toFixed(1))),
          backgroundColor: '#555566',
          borderRadius: 4
        }
      ]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            afterBody: (items) => {
              const i = items[0].dataIndex;
              const d = data[i].diff;
              return '변화량: ' + (d > 0 ? '+' : '') + d.toFixed(1) + '%p';
            }
          }
        }
      },
      scales: {
        x: {
          ticks: { callback: v => v + '%', color: '#888' },
          grid: { color: 'rgba(255,255,255,0.05)' }
        },
        y: {
          ticks: { color: '#ccc', font: { size: 12 }, autoSkip: false },
          grid: { display: false }
        }
      }
    }
  });
}

function renderTable(data) {
  document.getElementById('table-body').innerHTML = data.map((d, i) => {
    const cls = d.diff > 0 ? 'up' : 'down';
    const sign = d.diff > 0 ? '+' : '';
    return `<tr>
      <td><span class="rank-num">${i+1}.</span>${d.name}</td>
      <td class="right">${d.before.toFixed(1)}%</td>
      <td class="right">${d.after.toFixed(1)}%</td>
      <td class="right ${cls}">${sign}${d.diff.toFixed(1)}%p</td>
    </tr>`;
  }).join('');
}

function switchType(type) {
  currentType = type;
  document.getElementById('btn-op').className = 'toggle-btn' + (type === 'op' ? ' active-op' : '');
  document.getElementById('btn-favor').className = 'toggle-btn' + (type === 'favor' ? ' active-favor' : '');
  loadData(type);
}

loadData('op');
</script>
</body>
</html>
