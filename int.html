<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>클래스별 우승 직각 도넛 그래프 최종</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 16px 60px;
  font-family: "Segoe UI", "Malgun Gothic", sans-serif;
  background: #0d0e13;
  color: #e0e0e0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.chart-modal {
  width: min(1100px, 100%);
  border-radius: 24px;
  padding: 30px;
  background: #13151c;
  border: 1px solid #252836;
  box-shadow: 0 30px 80px rgba(0,0,0,0.50);
}

.chart-header { text-align: center; margin-bottom: 10px; }

.chart-class-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(167,139,250,0.12);
  border: 1px solid rgba(167,139,250,0.22);
  font-size: 13px;
  font-weight: 900;
  color: #c4b5fd;
  margin-bottom: 10px;
}

.chart-title {
  font-size: 24px;
  font-weight: 900;
  color: #fff;
  line-height: 1.35;
  margin-bottom: 6px;
}

.hl-op { color: #34d399; }
.hl-favor { color: #f7ca54; }
.chart-sub { font-size: 12px; color: #6b7280; }

.chart-body {
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 28px;
  align-items: start;
  margin-top: 18px;
}

.pie-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.pie-container {
  position: relative;
  width: 500px;
  height: 500px;
  overflow: visible;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.pie-container.fading { opacity: 0.35; transform: scale(0.97); }

.pie-container canvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: pointer;
}

.legend-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  justify-content: center;
  max-width: 700px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 800;
  color: #e5e7eb;
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.pie-note {
  font-size: 11px;
  color: #4b5563;
  text-align: center;
}

.pie-note strong { color: #6b7280; }

.control-panel {
  border-radius: 16px;
  background: #15171f;
  border: 1px solid #252836;
  overflow: visible;
  position: relative;
  z-index: 10;
}

.control-panel-head {
  padding: 12px 14px;
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid #252836;
  font-size: 11px;
  font-weight: 900;
  color: #a78bfa;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.control-body {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow: visible;
}

.type-toggle {
  display: flex;
  gap: 4px;
  padding: 4px;
  border-radius: 10px;
  background: #1a1c24;
  border: 1px solid #252836;
}

.type-btn {
  flex: 1;
  padding: 9px 12px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: #6b7280;
  font-size: 13px;
  font-weight: 900;
  cursor: pointer;
  transition: 0.15s ease;
}

.type-btn.active-op { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
.type-btn.active-favor { background: linear-gradient(135deg, #f7ca54, #f59e0b); color: #1a1000; }

.select-label {
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1px;
  color: #6b7280;
  text-transform: uppercase;
  margin-top: 4px;
}

.select-wrap {
  position: relative;
  z-index: 20;
}

.select-btn {
  width: 100%;
  padding: 11px 14px;
  border-radius: 12px;
  border: 1px solid #252836;
  background: #1a1c24;
  color: #fff;
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: 0.15s ease;
}

.select-btn:hover { border-color: #3b4563; background: #1e2030; }

.select-btn .arrow {
  font-size: 12px;
  color: #6b7280;
  transition: 0.2s ease;
}

.select-btn .arrow.open { transform: rotate(180deg); }

.select-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  border-radius: 12px;
  border: 1px solid #252836;
  background: #1a1c24;
  box-shadow: 0 12px 36px rgba(0,0,0,0.5);
  z-index: 30;
  display: none;
  max-height: 360px;
  overflow-y: auto;
}

.select-dropdown.show { display: block; }

.select-dropdown::-webkit-scrollbar { width: 4px; }
.select-dropdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; }

.select-group-label {
  padding: 8px 14px 4px;
  font-size: 10px;
  font-weight: 900;
  color: #4b5563;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.select-option {
  padding: 9px 14px;
  font-size: 13px;
  font-weight: 800;
  color: #9ca3af;
  cursor: pointer;
  transition: 0.12s ease;
}

.select-option:hover { background: #1e2030; color: #fff; }
.select-option.active { color: #3b82f6; background: rgba(59,130,246,0.08); }

.control-help {
  margin-top: 4px;
  font-size: 11px;
  line-height: 1.6;
  color: #6b7280;
}

.loading-text {
  text-align: center;
  color: #6b7280;
  font-size: 13px;
  padding: 20px 0;
}

@media (max-width: 980px) {
  .chart-body { grid-template-columns: 1fr; }
  .pie-container { width: 360px; height: 360px; }
}

@media (max-width: 520px) {
  .pie-container { width: 300px; height: 300px; }
  .chart-title { font-size: 20px; }
}
</style>
</head>
<body>

<div class="chart-modal">
  <div class="chart-header">
    <div class="chart-class-badge" id="classBadge">전사</div>
    <div class="chart-title" id="chartTitle">
      워로드가 선택한 <span class="hl-op">OP</span> 각인은?
    </div>
    <div class="chart-sub">해당 클래스 유저들이 최종 우승으로 선택한 각인 비율입니다.</div>
  </div>

  <div class="chart-body">
    <div class="pie-area">
      <div class="pie-container" id="pieWrap">
        <canvas id="pieCanvas" width="1000" height="1000"></canvas>
      </div>
      <div class="legend-wrap" id="legendWrap"></div>
      <div class="pie-note"><strong>기타</strong>는 6위 이상 전체 각인의 합산입니다.</div>

    <div class="control-panel">

          <div class="select-btn" id="selectBtn">
            <span id="selectLabel">워로드</span>

          </div>

          <div class="select-dropdown" id="selectDropdown">
            <div class="select-group-label">전사</div>
            <div class="select-option active" data-class="워로드" data-group="전사">워로드</div>
            <div class="select-option" data-class="버서커" data-group="전사">버서커</div>
            <div class="select-option" data-class="디스트로이어" data-group="전사">디스트로이어</div>
            <div class="select-option" data-class="홀리나이트" data-group="전사">홀리나이트</div>
            <div class="select-option" data-class="슬레이어" data-group="전사">슬레이어</div>
            <div class="select-option" data-class="발키리" data-group="전사">발키리</div>

            <div class="select-group-label">무도가</div>
            <div class="select-option" data-class="배틀마스터" data-group="무도가">배틀마스터</div>
            <div class="select-option" data-class="인파이터" data-group="무도가">인파이터</div>

            <div class="select-option" data-class="창술사" data-group="무도가">창술사</div>
            <div class="select-option" data-class="스트라이커" data-group="무도가">스트라이커</div>
            <div class="select-option" data-class="브레이커" data-group="무도가">브레이커</div>

            <div class="select-option" data-class="데빌헌터" data-group="헌터">데빌헌터</div>
            <div class="select-option" data-class="블래스터" data-group="헌터">블래스터</div>
            <div class="select-option" data-class="호크아이" data-group="헌터">호크아이</div>
            <div class="select-option" data-class="스카우터" data-group="헌터">스카우터</div>
            <div class="select-option" data-class="건슬링어" data-group="헌터">건슬링어</div>

            <div class="select-group-label">마법사</div>
            <div class="select-option" data-class="서머너" data-group="마법사">서머너</div>
            <div class="select-option" data-class="아르카나" data-group="마법사">아르카나</div>
            <div class="select-option" data-class="바드" data-group="마법사">바드</div>
            <div class="select-option" data-class="소서리스" data-group="마법사">소서리스</div>

            <div class="select-group-label">암살자</div>
            <div class="select-option" data-class="블레이드" data-group="암살자">블레이드</div>
            <div class="select-option" data-class="데모닉" data-group="암살자">데모닉</div>
            <div class="select-option" data-class="리퍼" data-group="암살자">리퍼</div>
            <div class="select-option" data-class="소울이터" data-group="암살자">소울이터</div>

            <div class="select-group-label">스페셜리스트</div>
            <div class="select-option" data-class="도화가" data-group="스페셜리스트">도화가</div>
            <div class="select-option" data-class="기상술사" data-group="스페셜리스트">기상술사</div>
            <div class="select-option" data-class="환수사" data-group="스페셜리스트">환수사</div>

            <div class="select-group-label">가디언나이트</div>
            <div class="select-option" data-class="가디언나이트" data-group="가디언나이트">가디언나이트</div>
          </div>
        </div>

        <div class="control-help">
          OP / 호감 토글과 클래스 선택에 따라<br>
          그래프가 자동 갱신됩니다.
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL = "https://khszfukekudyripouifm.supabase.co";
const SUPABASE_KEY = "sb_publishable_XjCVKOZRq1aERqzOGj_tHw_eC4uCXEb";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const COLORS = ["#3b82f6","#a78bfa","#f7ca54","#34d399","#f87171","#4b5563"];
const GLOW_A = [0.26,0.22,0.20,0.18,0.16,0.10];

const fullToShortMap = {
  "고독한 기사":"고기","전투 태세":"전태","광기":"광기","광전사의 비기":"비기",
  "분노의 망치":"분망","중력 수련":"중수","심판자":"심판자","축복의 오라":"축오",
  "처단자":"처단자","포식자":"포식자","빛의 기사":"빛의기사","해방자":"해방자",
  "초심":"초심","오의 강화":"오의","충격 단련":"충단","체술":"체술",
  "세맥타통":"세맥","역천지체":"역천","절정":"절정","절제":"절제",
  "오의난무":"난무","일격필살":"일격","권왕파천무":"권왕","수라의 길":"수라",
  "강화 무기":"강무","핸드거너":"핸드","화력 강화":"화강","포격 강화":"포강",
  "죽음의 습격":"죽습","두 번째 동료":"두동","진화의 유산":"유산",
  "아르데타인의 기술":"기술","피스메이커":"피메","사냥의 시간":"사시",
  "상급 소환사":"상소","넘치는 교감":"교감","황제의 칙령":"황제","황후의 은총":"황후",
  "진실된 용맹":"진용","절실한 구원":"절구","점화":"점화","환류":"환류",
  "버스트":"버스트","잔재된 기운":"잔재","멈출 수 없는 충동":"충동",
  "완벽한 억제":"억제","달의 소리":"달소","갈증":"갈증",
  "만월의 집행자":"만월","만개":"만개","그믐의 경계":"그믐","회귀":"회귀","이슬비":"이슬비",
  "질풍노도":"질풍","환수 각성":"환각","야성":"야성","업화":"업화","드레드 로어":"드드"
};

function getShort(n) { return fullToShortMap[n] || n; }

let currentClass = "워로드";
let currentGroup = "전사";
let currentType = "op";
let animId = null;
let currentData = [];
let sliceAngles = [];
let hoverIndex = -1;
let hoverScale = [];
let rafRunning = false;

// 드롭다운
const selectBtn = document.getElementById("selectBtn");
const selectLabel = document.getElementById("selectLabel");
const selectArrow = document.getElementById("selectArrow");
const selectDropdown = document.getElementById("selectDropdown");

selectBtn.addEventListener("click", () => {
  selectDropdown.classList.toggle("show");
  selectArrow.classList.toggle("open");
});

document.addEventListener("click", (e) => {
  if (!document.getElementById("selectWrap").contains(e.target)) {
    selectDropdown.classList.remove("show");
    selectArrow.classList.remove("open");
  }
});

document.querySelectorAll(".select-option").forEach(opt => {
  opt.addEventListener("click", () => {
    document.querySelectorAll(".select-option").forEach(o => o.classList.remove("active"));
    opt.classList.add("active");
    currentClass = opt.dataset.class;
    currentGroup = opt.dataset.group;
    selectLabel.textContent = currentClass;
    selectDropdown.classList.remove("show");
    selectArrow.classList.remove("open");
    animateRender();
  });
});

document.getElementById("typeOpBtn").addEventListener("click", () => {
  document.getElementById("typeOpBtn").className = "type-btn active-op";
  document.getElementById("typeFavorBtn").className = "type-btn";
  currentType = "op";
  animateRender();
});

document.getElementById("typeFavorBtn").addEventListener("click", () => {
  document.getElementById("typeFavorBtn").className = "type-btn active-favor";
  document.getElementById("typeOpBtn").className = "type-btn";
  currentType = "favor";
  animateRender();
});

async function loadRealData(cls, type) {
  const { data, error } = await supabase.rpc("get_class_winner_stats", { p_class: cls, p_type: type });
  if (error || !data || !data.length) return [];

  const rows = data.map(r => ({ name: getShort(r.winner_engraving), pct: Number(r.pick_rate) }));
  const total = rows.reduce((s, r) => s + r.pct, 0);
  if (total <= 0) return [];

  const top5 = rows.slice(0, 5);
  const etcPct = rows.slice(5).reduce((s, r) => s + r.pct, 0);

  const result = top5.map(r => ({ name: r.name, pct: Number((r.pct / total * 100).toFixed(1)) }));
  if (etcPct > 0) result.push({ name: "기타", pct: Number((etcPct / total * 100).toFixed(1)) });

  return result;
}

function updateHeader() {
  document.getElementById("classBadge").textContent = currentGroup;
  const hl = currentType === "op" ? '<span class="hl-op">OP</span>' : '<span class="hl-favor">호감</span>';
  document.getElementById("chartTitle").innerHTML = currentClass + "가 선택한 " + hl + " 각인은?";
}

function updateLegend(data) {
  document.getElementById("legendWrap").innerHTML = data.map((d, i) =>
    '<div class="legend-item"><div class="legend-dot" style="background:' + COLORS[i] + '"></div>' + d.name + ' ' + d.pct + '%</div>'
  ).join("");
}

function calcAngles(data) {
  const a = [];
  let c = 0;
  data.forEach(d => {
    const s = (c / 100) * Math.PI * 2 - Math.PI / 2;
    c += d.pct;
    const e = (c / 100) * Math.PI * 2 - Math.PI / 2;
    a.push({ start: s, end: e, mid: (s + e) / 2 });
  });
  return a;
}

function getHovered(mx, my) {
  const canvas = document.getElementById("pieCanvas");
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width / rect.width;
  const sy = canvas.height / rect.height;
  const x = (mx - rect.left) * sx;
  const y = (my - rect.top) * sy;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const r = canvas.width * 0.37;
  const inner = r - canvas.width * 0.14;
  const dx = x - cx, dy = y - cy;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < inner || dist > r + 30) return -1;
  let ang = Math.atan2(dy, dx);
  if (ang < -Math.PI / 2) ang += Math.PI * 2;
  for (let i = 0; i < sliceAngles.length; i++) {
    if (ang >= sliceAngles[i].start && ang <= sliceAngles[i].end) return i;
  }
  return -1;
}

const pieCanvas = document.getElementById("pieCanvas");

pieCanvas.addEventListener("mousemove", (ev) => {
  hoverIndex = getHovered(ev.clientX, ev.clientY);
  if (!rafRunning) startHoverLoop();
});

pieCanvas.addEventListener("mouseleave", () => {
  hoverIndex = -1;
});

pieCanvas.addEventListener("touchstart", (ev) => {
  const t = ev.touches[0];
  hoverIndex = getHovered(t.clientX, t.clientY);
  if (!rafRunning) startHoverLoop();
  setTimeout(() => { hoverIndex = -1; }, 1200);
}, { passive: true });

function startHoverLoop() {
  rafRunning = true;
  function loop() {
    drawDonut();
    let anyMoving = false;
    for (let i = 0; i < currentData.length; i++) {
      const target = hoverIndex === i ? 1 : 0;
      if (Math.abs((hoverScale[i] || 0) - target) > 0.005) anyMoving = true;
    }
    if (anyMoving || hoverIndex >= 0) {
      requestAnimationFrame(loop);
    } else {
      rafRunning = false;
    }
  }
  requestAnimationFrame(loop);
}

function drawDonut() {
  if (!currentData.length) return;

  const canvas = document.getElementById("pieCanvas");
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2;
  const r = w * 0.37;
  const thickness = w * 0.14;
  const innerR = r - thickness;

  ctx.clearRect(0, 0, w, h);

  currentData.forEach((d, i) => {
    const sa = sliceAngles[i];
    if (!sa) return;

    const target = hoverIndex === i ? 1 : 0;
    hoverScale[i] = hoverScale[i] || 0;
    // 더 부드러운 스프링 보간 (말랑말랑)
    hoverScale[i] += (target - hoverScale[i]) * 0.12;

    const pop = hoverScale[i];
    const popDist = pop * 22;
    const popScale = 1 + pop * 0.08;

    const offX = Math.cos(sa.mid) * popDist;
    const offY = Math.sin(sa.mid) * popDist;

    const lr = r * popScale;
    const lt = thickness * popScale;

    // 2차 글로우
    ctx.save();
    ctx.beginPath(); ctx.arc(cx + offX, cy + offY, lr, sa.start, sa.end);
    ctx.strokeStyle = COLORS[i]; ctx.lineWidth = lt + 44;
    ctx.globalAlpha = GLOW_A[i] * (0.32 + pop * 0.22); ctx.stroke(); ctx.restore();

    // 1차 글로우
    ctx.save();
    ctx.beginPath(); ctx.arc(cx + offX, cy + offY, lr, sa.start, sa.end);
    ctx.strokeStyle = COLORS[i]; ctx.lineWidth = lt + 22;
    ctx.globalAlpha = GLOW_A[i] * (1 + pop * 0.6); ctx.stroke(); ctx.restore();

    // 메인
    ctx.beginPath(); ctx.arc(cx + offX, cy + offY, lr, sa.start, sa.end);
    ctx.strokeStyle = COLORS[i]; ctx.lineWidth = lt; ctx.stroke();

    // 하이라이트
    ctx.save();
    ctx.beginPath(); ctx.arc(cx + offX, cy + offY, lr, sa.start, sa.end);
    const g = ctx.createLinearGradient(cx, cy - lr, cx, cy);
    g.addColorStop(0, "rgba(255,255,255," + (0.14 + pop * 0.10) + ")");
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.strokeStyle = g; ctx.lineWidth = lt * 0.42; ctx.stroke(); ctx.restore();

    // 라벨
    const lx = cx + offX + lr * Math.cos(sa.mid);
    const ly = cy + offY + lr * Math.sin(sa.mid);
    const ns = d.pct >= 10 ? w * 0.026 : w * 0.020;
    const ps = d.pct >= 10 ? w * 0.036 : w * 0.026;
    const labelScale = 1 + pop * 0.12;

    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,0.7)";
    ctx.shadowBlur = 8;

    ctx.font = "bold " + (ns * labelScale) + "px sans-serif";
    ctx.fillText(d.name, lx, ly - w * 0.014);

    ctx.font = "bold " + (ps * labelScale) + "px sans-serif";
    ctx.fillText(d.pct + "%", lx, ly + w * 0.016);
    ctx.restore();
  });

  // 가운데
  ctx.beginPath(); ctx.arc(cx, cy, innerR - 6, 0, Math.PI * 2);
  ctx.fillStyle = "#13151c"; ctx.fill();
  ctx.strokeStyle = "#252836"; ctx.lineWidth = 1; ctx.stroke();

  ctx.fillStyle = "#4b5563";
  ctx.font = "bold " + (w * 0.026) + "px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("TOP 5", cx, cy - w * 0.014);

  ctx.fillStyle = "#fff";
  ctx.font = "bold " + (w * 0.040) + "px sans-serif";
  ctx.fillText("우승 비율", cx, cy + w * 0.028);
}

function animateEntry(data) {
  if (animId) cancelAnimationFrame(animId);

  currentData = data;
  sliceAngles = calcAngles(data);
  hoverScale = data.map(() => 0);
  hoverIndex = -1;

  const canvas = document.getElementById("pieCanvas");
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2;
  const r = w * 0.37;
  const thickness = w * 0.14;
  const innerR = r - thickness;
  const dur = 850;
  const t0 = performance.now();

  function frame(now) {
    const p = Math.min((now - t0) / dur, 1);
    const ease = 1 - Math.pow(1 - p, 3);

    ctx.clearRect(0, 0, w, h);

    let cum = 0;

    data.forEach((d, i) => {
      const pn = d.pct * ease;
      const s = (cum / 100) * Math.PI * 2 - Math.PI / 2;
      cum += pn;
      const e = (cum / 100) * Math.PI * 2 - Math.PI / 2;
      if (e <= s) return;

      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, r, s, e);
      ctx.strokeStyle = COLORS[i]; ctx.lineWidth = thickness + 44;
      ctx.globalAlpha = GLOW_A[i] * 0.32; ctx.stroke(); ctx.restore();

      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, r, s, e);
      ctx.strokeStyle = COLORS[i]; ctx.lineWidth = thickness + 22;
      ctx.globalAlpha = GLOW_A[i]; ctx.stroke(); ctx.restore();

      ctx.beginPath(); ctx.arc(cx, cy, r, s, e);
      ctx.strokeStyle = COLORS[i]; ctx.lineWidth = thickness; ctx.stroke();

      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, r, s, e);
      const g = ctx.createLinearGradient(cx, cy - r, cx, cy);
      g.addColorStop(0, "rgba(255,255,255,0.14)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.strokeStyle = g; ctx.lineWidth = thickness * 0.42; ctx.stroke();
      ctx.restore();

      if (p >= 0.85) {
        const a = Math.min(1, (p - 0.85) / 0.15);
        const mid = (s + e) / 2;
        const lx = cx + r * Math.cos(mid);
        const ly = cy + r * Math.sin(mid);
        const ns = d.pct >= 10 ? w * 0.026 : w * 0.020;
        const ps = d.pct >= 10 ? w * 0.036 : w * 0.026;

        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = "rgba(0,0,0,0.7)";
        ctx.shadowBlur = 8;
        ctx.font = "bold " + ns + "px sans-serif";
        ctx.fillText(d.name, lx, ly - w * 0.014);
        ctx.font = "bold " + ps + "px sans-serif";
        ctx.fillText(d.pct + "%", lx, ly + w * 0.016);
        ctx.restore();
      }
    });

    ctx.beginPath(); ctx.arc(cx, cy, innerR - 6, 0, Math.PI * 2);
    ctx.fillStyle = "#13151c"; ctx.fill();
    ctx.strokeStyle = "#252836"; ctx.lineWidth = 1; ctx.stroke();

    ctx.fillStyle = "#4b5563";
    ctx.font = "bold " + (w * 0.026) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("TOP 5", cx, cy - w * 0.014);

    ctx.fillStyle = "#fff";
    ctx.font = "bold " + (w * 0.040) + "px sans-serif";
    ctx.fillText("우승 비율", cx, cy + w * 0.028);

    if (p < 1) animId = requestAnimationFrame(frame);
  }

  animId = requestAnimationFrame(frame);
}

async function animateRender() {
  const wrap = document.getElementById("pieWrap");
  wrap.classList.add("fading");
  document.getElementById("legendWrap").innerHTML = '<div class="loading-text">불러오는 중...</div>';

  updateHeader();

  const data = await loadRealData(currentClass, currentType);

  setTimeout(() => {
    animateEntry(data);
    updateLegend(data);
    wrap.classList.remove("fading");
  }, 220);
}

updateHeader();
animateRender();
</script>
