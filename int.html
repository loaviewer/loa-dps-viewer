<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>티카투카 AI 도우미</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap');

  :root {
    --wood-dark: #3d2008;
    --wood-mid: #6b3a1f;
    --wood-light: #a0622a;
    --wood-surface: #8b4e1e;
    --felt: #2d5016;
    --my-green: #4caf50;
    --my-green-bright: #76c442;
    --opp-red: #e53935;
    --opp-red-bright: #ff6b6b;
    --shield-glow: #ffd700;
    --dice-bg: #f5f0e8;
    --dice-border: #d4c9a8;
    --dot-green: #3a7d1e;
    --dot-red: #c0392b;
    --text-light: #f5f0e8;
    --text-muted: #c4a882;
    --panel-bg: rgba(20,10,0,0.7);
    --highlight: #ffe066;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: radial-gradient(ellipse at center, #5c2d0a 0%, #2a1005 100%);
    min-height: 100vh;
    color: var(--text-light);
    padding: 16px;
  }

  header {
    text-align: center;
    padding: 18px 0 10px;
  }
  header h1 {
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--highlight);
    text-shadow: 0 2px 12px #000a, 0 0 30px #ffd70055;
  }
  header p {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-top: 4px;
  }

  .main-layout {
    display: flex;
    gap: 18px;
    max-width: 980px;
    margin: 18px auto 0;
    align-items: flex-start;
  }

  /* ── 보드 패널 ── */
  .board-panel {
    background: var(--panel-bg);
    border: 2px solid var(--wood-light);
    border-radius: 18px;
    padding: 18px;
    flex: 1 1 0;
    min-width: 0;
  }

  .board-labels {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 4px;
  }
  .board-label {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 3px 14px;
    border-radius: 20px;
  }
  .board-label.me { background: #1a4010; color: var(--my-green-bright); border: 1px solid var(--my-green); }
  .board-label.opp { background: #3d0a0a; color: var(--opp-red-bright); border: 1px solid var(--opp-red); }

  .rows-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .side {
    display: flex;
    gap: 6px;
    flex: 1;
  }
  .side.me { justify-content: flex-end; }
  .side.opp { justify-content: flex-start; }

  .score-mid {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 80px;
  }
  .score-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    font-size: 1rem;
  }
  .score-me { color: var(--my-green-bright); }
  .score-opp { color: var(--opp-red-bright); }
  .score-sep { color: var(--text-muted); font-size: 0.75rem; }
  .row-result {
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 0.5px;
  }
  .row-result.win { background: #1a4010; color: var(--my-green-bright); }
  .row-result.lose { background: #3d0a0a; color: var(--opp-red-bright); }
  .row-result.tie { background: #333; color: #aaa; }
  .row-result.unknown { background: transparent; color: transparent; }

  /* ── 주사위 칸 ── */
  .dice-slot {
    width: 54px;
    height: 54px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    border: 2px dashed rgba(255,255,255,0.15);
    cursor: pointer;
    position: relative;
    transition: border-color 0.15s, box-shadow 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dice-slot:hover { border-color: rgba(255,255,255,0.4); }
  .dice-slot.filled {
    background: var(--dice-bg);
    border-style: solid;
  }
  .dice-slot.filled.me-normal { border-color: #888; }
  .dice-slot.filled.me-shield { border-color: var(--my-green); box-shadow: 0 0 10px #4caf5088; }
  .dice-slot.filled.opp-normal { border-color: #888; }
  .dice-slot.filled.opp-shield { border-color: var(--opp-red); box-shadow: 0 0 10px #e5393588; }
  .dice-slot.highlight-good { box-shadow: 0 0 0 3px var(--my-green-bright), 0 0 16px #76c44255 !important; border-color: var(--my-green-bright) !important; }
  .dice-slot.highlight-bad { box-shadow: 0 0 0 3px var(--opp-red-bright), 0 0 16px #ff6b6b55 !important; }
  .dice-slot.highlight-warn { box-shadow: 0 0 0 3px var(--highlight), 0 0 16px #ffd70055 !important; border-color: var(--highlight) !important; }

  /* ── 주사위 눈 ── */
  .dots {
    display: grid;
    width: 38px;
    height: 38px;
    padding: 4px;
    gap: 3px;
  }
  .dots.d1 { grid-template: 1fr / 1fr; }
  .dots.d2 { grid-template: 1fr 1fr / 1fr; }
  .dots.d3 { grid-template: 1fr 1fr 1fr / 1fr; }
  .dots.d4 { grid-template: 1fr 1fr / 1fr 1fr; }
  .dots.d5 { grid-template: 1fr 1fr 1fr / 1fr 1fr; }
  .dots.d6 { grid-template: 1fr 1fr 1fr / 1fr 1fr; }
  .dot {
    border-radius: 50%;
    width: 100%;
    height: 100%;
  }
  .dot.green { background: var(--dot-green); }
  .dot.red { background: var(--dot-red); }
  /* d5 center */
  .dots.d5 .dot:nth-child(5) { grid-column: 1 / 3; justify-self: center; width: 50%; }

  .slot-empty-text {
    font-size: 0.6rem;
    color: rgba(255,255,255,0.2);
    text-align: center;
    pointer-events: none;
  }

  /* ── 입력 모달 ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #2a1205;
    border: 2px solid var(--wood-light);
    border-radius: 18px;
    padding: 24px;
    min-width: 280px;
    max-width: 340px;
    width: 90vw;
  }
  .modal h3 { color: var(--highlight); font-size: 1rem; margin-bottom: 16px; text-align: center; }

  .num-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .num-btn {
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    color: var(--text-light);
    font-size: 1.3rem;
    font-weight: 700;
    padding: 12px 0;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .num-btn:hover { background: rgba(255,255,255,0.18); border-color: var(--highlight); }
  .num-btn.selected { background: #5a3500; border-color: var(--highlight); color: var(--highlight); }

  .shield-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 16px;
    font-size: 0.9rem;
  }
  .toggle-btn {
    padding: 6px 18px;
    border-radius: 20px;
    border: 2px solid;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 700;
    transition: all 0.12s;
  }
  .toggle-btn.normal { border-color: #888; background: transparent; color: #aaa; }
  .toggle-btn.normal.active { background: #444; color: #fff; border-color: #fff; }
  .toggle-btn.shield-me { border-color: var(--my-green); background: transparent; color: var(--my-green); }
  .toggle-btn.shield-me.active { background: #1a4010; color: var(--my-green-bright); }
  .toggle-btn.shield-opp { border-color: var(--opp-red); background: transparent; color: var(--opp-red); }
  .toggle-btn.shield-opp.active { background: #3d0a0a; color: var(--opp-red-bright); }

  .modal-actions {
    display: flex;
    gap: 8px;
  }
  .modal-actions button {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-confirm { background: var(--my-green); color: #fff; }
  .btn-confirm:hover { background: var(--my-green-bright); }
  .btn-clear { background: #555; color: #fff; }
  .btn-clear:hover { background: #777; }
  .btn-cancel { background: #333; color: #aaa; }
  .btn-cancel:hover { background: #444; }

  /* ── 우측 패널 ── */
  .right-panel {
    width: 260px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .panel-card {
    background: var(--panel-bg);
    border: 2px solid var(--wood-light);
    border-radius: 14px;
    padding: 14px;
  }
  .panel-card h3 {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  /* 현재 주사위 */
  .current-dice-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .current-dice-display {
    width: 60px;
    height: 60px;
    background: var(--dice-bg);
    border: 3px solid var(--highlight);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 14px #ffd70055;
  }
  .current-dice-info { flex: 1; }
  .current-dice-info .val { font-size: 1.6rem; font-weight: 900; color: var(--highlight); }
  .current-dice-info .type { font-size: 0.7rem; color: var(--text-muted); }

  .input-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .num-mini {
    flex: 1;
    padding: 8px 0;
    border-radius: 8px;
    border: 2px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: var(--text-light);
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: all 0.12s;
  }
  .num-mini:hover { border-color: var(--highlight); background: rgba(255,200,0,0.1); }
  .num-mini.sel { border-color: var(--highlight); background: #5a3500; color: var(--highlight); }

  .shield-check {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 0.8rem;
    cursor: pointer;
    color: var(--text-muted);
  }
  .shield-check input { accent-color: var(--shield-glow); width: 15px; height: 15px; }

  .btn-analyze {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #c8860a, #ffd700);
    border: none;
    border-radius: 10px;
    color: #1a0a00;
    font-size: 1rem;
    font-weight: 900;
    cursor: pointer;
    letter-spacing: 1px;
    transition: opacity 0.15s, transform 0.1s;
    margin-top: 4px;
  }
  .btn-analyze:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-analyze:active { transform: translateY(0); }

  .btn-reset {
    width: 100%;
    padding: 8px;
    background: transparent;
    border: 1px solid #555;
    border-radius: 8px;
    color: #888;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.12s;
  }
  .btn-reset:hover { border-color: #888; color: #ccc; }

  /* ── AI 추천 ── */
  .advice-box {
    min-height: 80px;
  }
  .advice-empty {
    color: var(--text-muted);
    font-size: 0.8rem;
    text-align: center;
    padding: 16px 0;
  }
  .advice-item {
    background: rgba(255,255,255,0.04);
    border-left: 3px solid var(--my-green);
    border-radius: 0 8px 8px 0;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 0.82rem;
    line-height: 1.5;
  }
  .advice-item.warn { border-left-color: var(--highlight); }
  .advice-item.danger { border-left-color: var(--opp-red); }
  .advice-tag {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 3px;
  }
  .advice-tag.good { color: var(--my-green-bright); }
  .advice-tag.warn { color: var(--highlight); }
  .advice-tag.danger { color: var(--opp-red-bright); }

  .win-meter {
    margin-top: 8px;
  }
  .win-label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
  .win-bar-wrap { height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; }
  .win-bar { height: 100%; background: linear-gradient(90deg, var(--my-green), var(--my-green-bright)); border-radius: 5px; transition: width 0.5s; }

  .loading {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
    font-size: 0.82rem;
    padding: 8px 0;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: var(--highlight);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 하단 범례 */
  .legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 8px;
    font-size: 0.68rem;
    color: var(--text-muted);
    justify-content: center;
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; border: 2px solid; }

  @media (max-width: 680px) {
    .main-layout { flex-direction: column; }
    .right-panel { width: 100%; }
    .dice-slot { width: 44px; height: 44px; }
  }
</style>
</head>
<body>

<header>
  <h1>🎲 티카투카 AI 도우미</h1>
  <p>각 칸을 클릭해서 주사위를 입력하세요</p>
</header>

<div class="main-layout">

  <!-- 보드 -->
  <div class="board-panel">
    <div class="board-labels">
      <span class="board-label me">🟢 나 (왼쪽)</span>
      <span class="board-label opp">🔴 상대 (오른쪽)</span>
    </div>
    <div class="rows-wrap" id="boardRows"></div>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="border-color:#4caf50;background:#1a4010"></span>내 실드</span>
      <span class="legend-item"><span class="legend-dot" style="border-color:#e53935;background:#3d0a0a"></span>상대 실드</span>
      <span class="legend-item"><span class="legend-dot" style="border-color:#888;background:#555"></span>일반</span>
      <span class="legend-item"><span class="legend-dot" style="border-color:#ffd700;background:#5a3500"></span>추천 배치</span>
    </div>
  </div>

  <!-- 우측 패널 -->
  <div class="right-panel">

    <div class="panel-card">
      <h3>🎲 현재 굴린 주사위</h3>
      <div class="current-dice-wrap">
        <div class="current-dice-display" id="currentDiceDisplay">
          <span style="color:#555;font-size:1.2rem">?</span>
        </div>
        <div class="current-dice-info">
          <div class="val" id="currentDiceVal">-</div>
          <div class="type" id="currentDiceType">숫자를 선택하세요</div>
        </div>
      </div>
      <div class="input-row" id="numButtons"></div>
      <label class="shield-check">
        <input type="checkbox" id="isShield">
        🛡️ 실드 주사위
      </label>
    </div>

    <button class="btn-analyze" onclick="analyze()">⚡ 최적 배치 분석</button>
    <button class="btn-reset" onclick="resetBoard()">🔄 보드 초기화</button>

    <div class="panel-card advice-box">
      <h3>💡 AI 추천</h3>
      <div id="adviceContent">
        <div class="advice-empty">분석 버튼을 눌러주세요</div>
      </div>
    </div>

    <div class="panel-card">
      <h3>📊 현재 전황</h3>
      <div id="statusContent">
        <div class="advice-empty">보드를 입력하면 분석됩니다</div>
      </div>
    </div>

  </div>
</div>

<!-- 입력 모달 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">주사위 입력</h3>
    <div class="num-grid" id="modalNumGrid"></div>
    <div class="shield-toggle" id="modalShieldToggle"></div>
    <div class="modal-actions">
      <button class="btn-clear" onclick="clearSlot()">지우기</button>
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-confirm" onclick="confirmSlot()">확인</button>
    </div>
  </div>
</div>

<script>
// ── 상태 ──
const ROWS = 3;
const COLS = 3;

// board[side][row][col] = { val: 1-6|null, shield: bool }
let board = {
  me: Array.from({length:ROWS}, ()=>Array.from({length:COLS},()=>({val:null,shield:false}))),
  opp: Array.from({length:ROWS}, ()=>Array.from({length:COLS},()=>({val:null,shield:false})))
};

let currentDice = { val: null, shield: false };
let modal = { side: null, row: null, col: null, selVal: null, selShield: false };

// ── 점수 계산 ──
function calcScore(dice) {
  // dice = [{val, shield}, ...]  filled only
  const vals = dice.filter(d=>d.val!==null).map(d=>d.val);
  if (vals.length === 0) return 0;
  const sum = vals.reduce((a,b)=>a+b,0);
  // 같은 숫자 보너스: 숫자 × 개수 + 숫자 × (개수-1) for each group
  const freq = {};
  vals.forEach(v=>freq[v]=(freq[v]||0)+1);
  let bonus = 0;
  Object.entries(freq).forEach(([v,cnt])=>{
    if (cnt>=2) bonus += Number(v)*cnt + Number(v)*(cnt-1) - Number(v)*cnt;
    // 실제론: score = 숫자×개수 + 숫자×(개수-1)
    // = 숫자 * (2*cnt - 1)  but we already have sum
    // re-derive: for group of cnt same val v: contributes v*cnt to sum, bonus = v*(cnt-1)
  });
  // correct bonus: each group of same contributes sum=v*cnt already in sum, bonus=v*(cnt-1) extra
  let total = 0;
  Object.entries(freq).forEach(([v,cnt])=>{
    total += Number(v)*cnt + Number(v)*(cnt-1);
  });
  // add singles
  // total already handles all: singles cnt=1 → v*1+v*0=v ✓
  return total;
}

function getRowDice(side, row) {
  return board[side][row];
}

function rowScore(side, row) {
  return calcScore(getRowDice(side, row));
}

// ── 보드 렌더 ──
function buildBoard() {
  const wrap = document.getElementById('boardRows');
  wrap.innerHTML = '';
  for (let r=0; r<ROWS; r++) {
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    rowEl.id = `row-${r}`;

    // 내 쪽 (오른쪽 정렬, col 2→0)
    const meDiv = document.createElement('div');
    meDiv.className = 'side me';
    for (let c=COLS-1; c>=0; c--) {
      meDiv.appendChild(makeSlot('me', r, c));
    }

    // 가운데 점수
    const mid = document.createElement('div');
    mid.className = 'score-mid';
    mid.id = `mid-${r}`;

    // 상대 쪽
    const oppDiv = document.createElement('div');
    oppDiv.className = 'side opp';
    for (let c=0; c<COLS; c++) {
      oppDiv.appendChild(makeSlot('opp', r, c));
    }

    rowEl.appendChild(meDiv);
    rowEl.appendChild(mid);
    rowEl.appendChild(oppDiv);
    wrap.appendChild(rowEl);
  }
  refreshScores();
}

function makeSlot(side, row, col) {
  const el = document.createElement('div');
  el.className = 'dice-slot';
  el.id = `slot-${side}-${row}-${col}`;
  el.onclick = () => openModal(side, row, col);
  renderSlot(el, side, row, col);
  return el;
}

function renderSlot(el, side, row, col) {
  const d = board[side][row][col];
  el.innerHTML = '';
  el.className = 'dice-slot';
  if (d.val === null) {
    const t = document.createElement('div');
    t.className = 'slot-empty-text';
    t.textContent = '클릭';
    el.appendChild(t);
  } else {
    el.classList.add('filled');
    if (side==='me') {
      el.classList.add(d.shield ? 'me-shield' : 'me-normal');
    } else {
      el.classList.add(d.shield ? 'opp-shield' : 'opp-normal');
    }
    el.appendChild(makeDots(d.val, side==='me'?'green':'red'));
  }
}

function makeDots(val, color) {
  const wrap = document.createElement('div');
  wrap.className = `dots d${val}`;
  const patterns = {
    1: [5],
    2: [1,9],
    3: [1,5,9],
    4: [1,3,7,9],
    5: [1,3,5,7,9],
    6: [1,2,4,5,7,8]
  };
  // 3x3 grid positions 1-9
  const positions = patterns[val] || [];
  for (let i=1; i<=9; i++) {
    if (positions.includes(i)) {
      const d = document.createElement('div');
      d.className = `dot ${color}`;
      wrap.appendChild(d);
    } else {
      const s = document.createElement('div');
      s.style.visibility='hidden';
      wrap.appendChild(s);
    }
  }
  // override grid for dice faces
  wrap.style.display='grid';
  wrap.style.gridTemplate='repeat(3,1fr)/repeat(3,1fr)';
  wrap.style.width='38px';
  wrap.style.height='38px';
  wrap.style.padding='4px';
  wrap.style.gap='2px';
  return wrap;
}

function refreshScores() {
  for (let r=0; r<ROWS; r++) {
    const ms = rowScore('me', r);
    const os = rowScore('opp', r);
    const mid = document.getElementById(`mid-${r}`);
    let result = 'unknown', label = '';
    const meFilled = board.me[r].filter(d=>d.val!==null).length;
    const oppFilled = board.opp[r].filter(d=>d.val!==null).length;
    if (meFilled>0 || oppFilled>0) {
      if (ms>os) { result='win'; label='내가 유리'; }
      else if (ms<os) { result='lose'; label='상대 유리'; }
      else if (ms===os && ms>0) { result='tie'; label='동점'; }
    }
    mid.innerHTML = `
      <div class="score-bar">
        <span class="score-me">${ms}</span>
        <span class="score-sep">vs</span>
        <span class="score-opp">${os}</span>
      </div>
      <div class="row-result ${result}">${label}</div>
    `;
  }
  updateStatus();
}

function updateStatus() {
  let wins=0, losses=0, ties=0;
  let totalMe=0, totalOpp=0;
  for (let r=0; r<ROWS; r++) {
    const ms=rowScore('me',r), os=rowScore('opp',r);
    totalMe+=ms; totalOpp+=os;
    const mf=board.me[r].filter(d=>d.val!==null).length;
    const of_=board.opp[r].filter(d=>d.val!==null).length;
    if (mf>0||of_>0) {
      if(ms>os)wins++; else if(ms<os)losses++; else ties++;
    }
  }
  const sc = document.getElementById('statusContent');
  const winPct = totalMe+totalOpp>0 ? Math.round(totalMe/(totalMe+totalOpp)*100) : 50;
  sc.innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:8px;">
      <span style="color:var(--my-green-bright)">🟢 ${wins}줄 우세</span>
      <span style="color:#aaa">${ties}줄 동점</span>
      <span style="color:var(--opp-red-bright)">🔴 ${losses}줄 열세</span>
    </div>
    <div class="win-meter">
      <div class="win-label"><span>내 점수 비중</span><span>${totalMe} vs ${totalOpp}</span></div>
      <div class="win-bar-wrap"><div class="win-bar" style="width:${winPct}%"></div></div>
    </div>
  `;
}

// ── 모달 ──
function openModal(side, row, col) {
  modal.side=side; modal.row=row; modal.col=col;
  const d = board[side][row][col];
  modal.selVal = d.val;
  modal.selShield = d.shield;

  const title = document.getElementById('modalTitle');
  title.textContent = `${side==='me'?'🟢 내':'🔴 상대'} ${row+1}행 ${col+1}번째 주사위`;

  const grid = document.getElementById('modalNumGrid');
  grid.innerHTML = '';
  for (let v=1; v<=6; v++) {
    const btn = document.createElement('button');
    btn.className = 'num-btn' + (modal.selVal===v?' selected':'');
    btn.textContent = v;
    btn.onclick = ()=>selectModalNum(v);
    grid.appendChild(btn);
  }

  const stDiv = document.getElementById('modalShieldToggle');
  stDiv.innerHTML = '';
  if (side==='me') {
    stDiv.innerHTML = `
      <button class="toggle-btn normal ${!modal.selShield?'active':''}" onclick="setModalShield(false)">일반</button>
      <button class="toggle-btn shield-me ${modal.selShield?'active':''}" onclick="setModalShield(true)">🛡️ 실드</button>
    `;
  } else {
    stDiv.innerHTML = `
      <button class="toggle-btn normal ${!modal.selShield?'active':''}" onclick="setModalShield(false)">일반</button>
      <button class="toggle-btn shield-opp ${modal.selShield?'active':''}" onclick="setModalShield(true)">🛡️ 실드</button>
    `;
  }

  document.getElementById('modalOverlay').classList.add('show');
}

function selectModalNum(v) {
  modal.selVal = v;
  document.querySelectorAll('#modalNumGrid .num-btn').forEach((b,i)=>{
    b.classList.toggle('selected', i+1===v);
  });
}

function setModalShield(s) {
  modal.selShield = s;
  const stDiv = document.getElementById('modalShieldToggle');
  stDiv.querySelectorAll('.toggle-btn').forEach(b=>{
    b.classList.remove('active');
  });
  if (s) stDiv.querySelector('.toggle-btn:last-child').classList.add('active');
  else stDiv.querySelector('.toggle-btn:first-child').classList.add('active');
}

function confirmSlot() {
  if (modal.selVal===null) { closeModal(); return; }
  board[modal.side][modal.row][modal.col] = { val: modal.selVal, shield: modal.selShield };
  const el = document.getElementById(`slot-${modal.side}-${modal.row}-${modal.col}`);
  renderSlot(el, modal.side, modal.row, modal.col);
  refreshScores();
  closeModal();
}

function clearSlot() {
  board[modal.side][modal.row][modal.col] = { val: null, shield: false };
  const el = document.getElementById(`slot-${modal.side}-${modal.row}-${modal.col}`);
  renderSlot(el, modal.side, modal.row, modal.col);
  refreshScores();
  closeModal();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

// ── 현재 주사위 입력 ──
function buildNumButtons() {
  const wrap = document.getElementById('numButtons');
  for (let v=1; v<=6; v++) {
    const btn = document.createElement('button');
    btn.className = 'num-mini';
    btn.textContent = v;
    btn.onclick = ()=>selectCurrent(v);
    wrap.appendChild(btn);
  }
  document.getElementById('isShield').addEventListener('change', e=>{
    currentDice.shield = e.target.checked;
    updateCurrentDisplay();
  });
}

function selectCurrent(v) {
  currentDice.val = v;
  currentDice.shield = document.getElementById('isShield').checked;
  document.querySelectorAll('.num-mini').forEach((b,i)=>{
    b.classList.toggle('sel', i+1===v);
  });
  updateCurrentDisplay();
}

function updateCurrentDisplay() {
  const disp = document.getElementById('currentDiceDisplay');
  const val = document.getElementById('currentDiceVal');
  const type = document.getElementById('currentDiceType');
  if (currentDice.val) {
    disp.style.borderColor = currentDice.shield ? 'var(--shield-glow)' : '#888';
    disp.innerHTML = '';
    disp.appendChild(makeDots(currentDice.val, 'green'));
    val.textContent = currentDice.val;
    type.textContent = currentDice.shield ? '🛡️ 실드 주사위' : '일반 주사위';
  }
}

// ── AI 분석 (로직 기반) ──
function analyze() {
  clearHighlights();
  const ac = document.getElementById('adviceContent');

  if (currentDice.val === null) {
    ac.innerHTML = `<div class="advice-empty">먼저 현재 주사위 숫자를 선택하세요!</div>`;
    return;
  }

  ac.innerHTML = `<div class="loading"><div class="spinner"></div>분석 중...</div>`;

  setTimeout(()=>{
    const advice = computeAdvice();
    renderAdvice(advice);
  }, 400);
}

function computeAdvice() {
  const cv = currentDice.val;
  const isShield = currentDice.shield;
  const tips = [];
  let bestAction = null;
  let bestScore = -Infinity;

  // 1. 알까기 가능 여부 체크 (일반 주사위일 때만)
  if (!isShield) {
    for (let r=0; r<ROWS; r++) {
      const meEmpty = board.me[r].filter(d=>d.val===null).length;
      if (meEmpty === 0) continue; // 내 줄이 꽉 차면 알까기 불가
      // 상대 같은 줄에 같은 숫자 일반 주사위 있는지
      const oppSame = board.opp[r].filter(d=>d.val===cv && !d.shield);
      if (oppSame.length > 0) {
        // 알까기 가능!
        const oppScoreBefore = rowScore('opp', r);
        // 제거 후 점수 계산
        const oppAfter = board.opp[r].filter(d=>!(d.val===cv && !d.shield));
        const oppScoreAfter = calcScore(oppAfter);
        const gain = oppScoreBefore - oppScoreAfter;
        const meScore = rowScore('me', r);
        const priority = gain + (oppScoreAfter < meScore ? 50 : 0);
        tips.push({
          type: 'good',
          tag: '🎯 알까기 가능!',
          msg: `${r+1}행에 ${cv} 배치 → 상대 ${cv} 주사위 ${oppSame.length}개 제거 (점수 -${gain}) + 실드 획득`,
          row: r,
          side: 'me',
          priority: priority + 100
        });
        if (priority+100 > bestScore) { bestScore=priority+100; bestAction={row:r,side:'me'}; }
      }
    }
  }

  // 2. 실드 배치 (상대 보드에 놓아서 죽은 라인 만들기)
  if (isShield) {
    for (let r=0; r<ROWS; r++) {
      const oppEmpty = board.opp[r].filter(d=>d.val===null).length;
      const oppFilled = board.opp[r].filter(d=>d.val!==null).length;
      if (oppEmpty > 0) {
        const oppScore = rowScore('opp', r);
        const meScore = rowScore('me', r);
        if (oppFilled === 2 && meScore > oppScore + cv) {
          // 상대 라인 꽉 채워서 죽은 라인 만들기
          tips.push({
            type: 'good',
            tag: '💀 죽은 라인 생성',
            msg: `상대 ${r+1}행에 실드 배치 → 상대 라인 봉쇄 (알까기 불가 상태 만들기)`,
            row: r, side: 'opp',
            priority: 90
          });
          if (90>bestScore) { bestScore=90; bestAction={row:r,side:'opp'}; }
        }
      }
    }
    // 내 보드에서 이기는 라인 중복 잠금
    for (let r=0; r<ROWS; r++) {
      const meScore = rowScore('me', r);
      const oppScore = rowScore('opp', r);
      const meEmpty = board.me[r].filter(d=>d.val===null).length;
      if (meEmpty>0 && meScore>oppScore) {
        // 내 이기는 라인에 실드로 중복 추가
        const hasSameVal = board.me[r].some(d=>d.val===cv);
        const priority = hasSameVal ? 80 : 50;
        tips.push({
          type: hasSameVal?'good':'warn',
          tag: hasSameVal?'🔒 중복 잠금':'🛡️ 실드 배치',
          msg: `내 ${r+1}행에 실드 배치 ${hasSameVal?'('+cv+' 중복 → 보너스 점수!)':'(이기는 라인 강화)'}`,
          row: r, side: 'me',
          priority
        });
        if (priority>bestScore) { bestScore=priority; bestAction={row:r,side:'me'}; }
      }
    }
  }

  // 3. 일반 배치 전략
  if (!isShield) {
    for (let r=0; r<ROWS; r++) {
      const meEmpty = board.me[r].filter(d=>d.val===null).length;
      if (meEmpty===0) continue;
      const meScore = rowScore('me', r);
      const oppScore = rowScore('opp', r);
      const hasSameVal = board.me[r].some(d=>d.val===cv && !d.shield);

      if (hasSameVal) {
        // 중복 만들기
        const newScore = calcScore([...board.me[r].filter(d=>d.val!==null), {val:cv,shield:false}]);
        const bonus = newScore - meScore;
        const priority = meScore<oppScore ? 70+bonus : 40+bonus;
        tips.push({
          type: 'good',
          tag: '🔢 중복 보너스',
          msg: `내 ${r+1}행에 배치 → ${cv} 중복으로 +${bonus} 보너스 (${meScore}→${newScore})`,
          row: r, side: 'me',
          priority
        });
        if (priority>bestScore) { bestScore=priority; bestAction={row:r,side:'me'}; }
      } else if (meScore < oppScore) {
        // 지는 라인 뒤집기
        const newScore = calcScore([...board.me[r].filter(d=>d.val!==null), {val:cv,shield:false}]);
        if (newScore > oppScore) {
          tips.push({
            type: 'good',
            tag: '↩️ 역전!',
            msg: `내 ${r+1}행에 배치 → ${meScore}→${newScore} (상대 ${oppScore} 역전!)`,
            row: r, side: 'me',
            priority: 75
          });
          if (75>bestScore) { bestScore=75; bestAction={row:r,side:'me'}; }
        } else {
          tips.push({
            type: 'warn',
            tag: '📉 열세 라인',
            msg: `내 ${r+1}행 (${meScore} vs 상대 ${oppScore}) — 역전은 못하지만 격차 줄이기`,
            row: r, side: 'me',
            priority: 30
          });
        }
      } else {
        // 이기는 라인 강화 (낮은 우선순위)
        if (meEmpty < 3) { // 이미 1개 이상 배치된 라인만
          tips.push({
            type: 'warn',
            tag: '✅ 이기는 라인',
            msg: `내 ${r+1}행 (${meScore} vs 상대 ${oppScore}) — 과투자 주의, 필요시만 배치`,
            row: r, side: 'me',
            priority: 20
          });
        }
      }
    }
  }

  // 경고: 상대 위험한 중복
  for (let r=0; r<ROWS; r++) {
    const oppVals = board.opp[r].filter(d=>d.val!==null && !d.shield).map(d=>d.val);
    const freq = {};
    oppVals.forEach(v=>freq[v]=(freq[v]||0)+1);
    Object.entries(freq).forEach(([v,cnt])=>{
      if (cnt>=2 && Number(v)>=4) {
        tips.push({
          type: 'danger',
          tag: '⚠️ 위험',
          msg: `상대 ${r+1}행에 ${v}×${cnt} 중복! (점수: ${rowScore('opp',r)}) — 빨리 공략 필요`,
          row: r, side: 'opp',
          priority: 0,
          warnOnly: true
        });
      }
    });
  }

  // 정렬
  tips.sort((a,b)=>b.priority-a.priority);

  return { tips: tips.slice(0,4), bestAction };
}

function renderAdvice({ tips, bestAction }) {
  const ac = document.getElementById('adviceContent');
  if (tips.length===0) {
    ac.innerHTML = `<div class="advice-empty">배치 가능한 칸이 없거나 분석 불가</div>`;
    return;
  }
  ac.innerHTML = tips.map(t=>`
    <div class="advice-item ${t.type==='danger'?'danger':t.type==='warn'?'warn':''}">
      <div class="advice-tag ${t.type}">${t.tag}</div>
      <div>${t.msg}</div>
    </div>
  `).join('');

  // 최적 칸 하이라이트
  if (bestAction) {
    const {side, row} = bestAction;
    // 첫 번째 빈 칸 하이라이트
    for (let c=0; c<COLS; c++) {
      if (board[side][row][c].val===null) {
        const el = document.getElementById(`slot-${side}-${row}-${c}`);
        if (el) el.classList.add('highlight-good');
        break;
      }
    }
    // 위험 경고 하이라이트
    tips.filter(t=>t.warnOnly).forEach(t=>{
      for (let c=0; c<COLS; c++) {
        const el = document.getElementById(`slot-${t.side}-${t.row}-${c}`);
        if (el && !board[t.side][t.row][c].shield) el.classList.add('highlight-bad');
      }
    });
  }
}

function clearHighlights() {
  document.querySelectorAll('.dice-slot').forEach(el=>{
    el.classList.remove('highlight-good','highlight-bad','highlight-warn');
  });
}

function resetBoard() {
  board = {
    me: Array.from({length:ROWS},()=>Array.from({length:COLS},()=>({val:null,shield:false}))),
    opp: Array.from({length:ROWS},()=>Array.from({length:COLS},()=>({val:null,shield:false})))
  };
  currentDice = {val:null, shield:false};
  document.querySelectorAll('.num-mini').forEach(b=>b.classList.remove('sel'));
  document.getElementById('isShield').checked=false;
  document.getElementById('currentDiceVal').textContent='-';
  document.getElementById('currentDiceType').textContent='숫자를 선택하세요';
  document.getElementById('currentDiceDisplay').innerHTML='<span style="color:#555;font-size:1.2rem">?</span>';
  document.getElementById('adviceContent').innerHTML='<div class="advice-empty">분석 버튼을 눌러주세요</div>';
  buildBoard();
}

// ── 초기화 ──
buildBoard();
buildNumButtons();
</script>
