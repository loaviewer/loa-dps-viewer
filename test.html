<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아브렐슈드 EX G4 DPS Settlement Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 기본 테마 및 변수 정의 (리얼 다크모드) */
        :root {
            --bg-body: #0b0c10;
            --bg-container: #12141c;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --bg-input-sec: #1f242d;
            --border-color: #2f3644;
            --input-bg: #12141c;
            --input-text: #ffffff;
            --tab-inactive: #242936;
            --tab-inactive-text: #64748b;
            --bg-info-box: rgba(0, 0, 0, 0.4);
            
            /* 다크모드 강조행 */
            --hl-15-bg: rgba(249, 115, 22, 0.15);
            --hl-15-border: #f97316;
            --hl-15-text: #ff9d5c;
            
            --hl-1666-bg: rgba(234, 179, 8, 0.15);
            --hl-1666-border: #eab308;
            --hl-1666-text: #fde047;
            
            --hl-20-bg: rgba(233, 69, 96, 0.2);
            --hl-20-border: #e94560;
            --hl-20-text: #ff6b8b;
        }

        /* 라이트모드 변수 */
        [data-theme="light"] {
            --bg-body: #f0f2f5;
            --bg-container: #ffffff;
            --text-main: #1e293b; 
            --text-sub: #475569;  
            --bg-input-sec: #f8fafc;
            --border-color: #cbd5e1;
            --input-bg: #ffffff;
            --input-text: #0f172a;
            --tab-inactive: #e2e8f0;
            --tab-inactive-text: #64748b;
            --bg-info-box: #f1f5f9;
            
            /* 화이트모드 강조행 */
            --hl-15-bg: #ffedd5;
            --hl-15-border: #ea580c;
            --hl-15-text: #c2410c;
            
            --hl-1666-bg: #fef9c3;
            --hl-1666-border: #ca8a04;
            --hl-1666-text: #a16207;
            
            --hl-20-bg: #ffe4e6;
            --hl-20-border: #e11d48;
            --hl-20-text: #9f1239;
        }

        * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; transition: background-color 0.2s, color 0.2s, border-color 0.2s; }
        body { background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .calc-container { background-color: var(--bg-container); width: 100%; max-width: 1200px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); overflow: hidden; padding: 40px; position: relative; }
        
        /* 상단 헤더 */
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #e94560; padding-bottom: 15px; }
        h1 { margin: 0; color: var(--text-main); font-size: 26px; }
        
        /* 토글 스위치 */
        .switch-wrapper { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: var(--text-main); }
        .switch { position: relative; display: inline-block; width: 60px; height: 30px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .3s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        input:checked + .slider { background-color: #e94560; }
        input:checked + .slider:before { transform: translateX(30px); }

        /* 상단 탭 메뉴 - 깔끔하게 나메 / 하드 / 노말 통일 */
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 15px; border: none; border-radius: 8px; background: var(--tab-inactive); cursor: pointer; font-weight: 700; font-size: 18px; color: var(--tab-inactive-text); transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .tab-btn.active.nm { background: #e94560; color: #ffffff; }
        .tab-btn.active.hd { background: #3a4f6b; color: #ffffff; }
        .tab-btn.active.nl { background: #3b593f; color: #ffffff; }
        
        /* 메인 레이아웃 */
        .calc-wrapper { display: grid; grid-template-columns: 1.25fr 1fr; gap: 30px; align-items: start; }
        
        /* 입력 섹션 */
        .input-section { background: var(--bg-input-sec); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .section-title { font-size: 18px; font-weight: 700; color: var(--text-main); margin: 0; }
        .btn-reset { background: #e94560; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 14px; }
        .btn-reset:hover { opacity: 0.9; }
        
        .input-group { display: grid; grid-template-columns: 1.5fr 1fr; align-items: center; margin-bottom: 14px; }
        .input-group label { font-size: 15px; font-weight: 700; color: var(--text-main); }
        
        .input-container { position: relative; width: 100%; }
        
        /* 인풋 휠/화살표 작동 버그 완전 수정 */
        .input-group input { 
            width: 100%; 
            padding: 12px 15px 12px 35px; /* 화살표가 우측에 생기므로, 숫자가 완전히 중앙에 맞도록 패딩 비대칭 미세조정 */
            border: 2px solid var(--border-color); 
            background: var(--input-bg); 
            color: var(--input-text); 
            border-radius: 8px; 
            text-align: center; 
            font-size: 18px; 
            font-weight: 700; 
        }
        .input-group input:focus { border-color: #e94560; outline: none; }
        
        /* 순정 화살표를 살리되, 평소에는 가리고 호버 시에만 투명도를 주어 활성화 및 클릭 가능하게 처리 */
        .input-group input::-webkit-inner-spin-button {
            transition: opacity 0.15s;
            opacity: 0;
            cursor: pointer;
            height: 28px;
        }
        .input-container:hover input::-webkit-inner-spin-button {
            opacity: 1; /* 마우스 올렸을 때 클릭 가능한 실제 화살표 노출 */
        }
        
        /* 파이어폭스 대응 스핀버튼 제어 */
        .input-group input { -moz-appearance: textfield; }
        .input-container:hover input { -moz-appearance: number-input; }
        
        /* 하단 고정 안내 문구 */
        .notice-text { font-size: 13px; color: var(--text-sub); line-height: 1.6; margin-top: 15px; margin-bottom: 20px; word-break: keep-all; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 6px; border-left: 4px solid #e94560; font-weight: 700; }
        
        /* 출력 섹션 */
        .output-section { background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; display: flex; flex-direction: column; gap: 20px; height: 100%; }
        [data-theme="light"] .output-section { background: #f8fafc; }

        .total-info { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 10px; text-align: center; border: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        [data-theme="light"] .total-info { background: #edf2f7; }
        
        /* 상단 식별 배지 영역 삭제 후 정돈 */
        .hp-header { display: flex; align-items: center; justify-content: center; margin-bottom: 5px; }
        .total-info p { margin: 0; font-size: 16px; font-weight: 700; color: var(--text-sub); }
        .total-info span { font-size: 28px; font-weight: 700; color: #ffbc00; }
        [data-theme="light"] .total-info span { color: #b45309; }
        
        .result-title { font-size: 15px; font-weight: 700; text-align: center; color: #ffbc00; margin: 0; }
        [data-theme="light"] .result-title { color: #b45309; }

        .result-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .result-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 11px 16px; 
            border-bottom: 1px solid var(--border-color);
            font-size: 15px; 
            color: var(--text-main); 
            background: rgba(255, 255, 255, 0.02);
        }
        .result-item:last-child { border-bottom: none; }
        [data-theme="light"] .result-item { background: #ffffff; border-bottom: 1px solid #e2e8f0; }
        
        .result-item .pct-num { font-weight: 700; font-size: 15px; }
        .result-item b { font-size: 16px; }

        /* 하이라이트 행 영역 */
        .result-item.highlight-15 { 
            background-color: var(--hl-15-bg) !important; 
            border-bottom: 1px solid var(--hl-15-border);
            color: var(--hl-15-text) !important; 
            font-weight: 700; 
        }
        .result-item.highlight-15 b { color: var(--hl-15-text) !important; }
        
        .result-item.highlight-1666 { 
            background-color: var(--hl-1666-bg) !important; 
            border-bottom: 1px solid var(--hl-1666-border);
            color: var(--hl-1666-text) !important; 
            font-weight: 700; 
        }
        .result-item.highlight-1666 b { color: var(--hl-1666-text) !important; }

        .result-item.highlight-20 { 
            background-color: var(--hl-20-bg) !important; 
            border-bottom: 1px solid var(--hl-20-border);
            color: var(--hl-20-text) !important; 
            font-weight: 700; 
        }
        .result-item.highlight-20 b { color: var(--hl-20-text) !important; }

        /* 에스더 정보 박스 */
        .esther-info-box { background: var(--bg-info-box); border: 1px solid var(--border-color); padding: 15px; border-radius: 10px; margin-top: 10px; }
        .esther-info-title { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 12px; border-left: 4px solid #ffbc00; padding-left: 8px; }
        [data-theme="light"] .esther-info-title { border-left-color: #b45309; }
        
        .esther-vertical-list { display: flex; flex-direction: column; gap: 8px; }
        .esther-list-item { display: flex; justify-content: space-between; padding: 6px 12px; background: rgba(0,0,0,0.2); border-radius: 5px; color: var(--text-sub); font-size: 14px; border: 1px solid rgba(255,255,255,0.03); }
        [data-theme="light"] .esther-list-item { background: #e2e8f0; border: 1px solid #cbd5e1; }
        .esther-list-item span.name { font-weight: 700; color: var(--text-main); }
        .esther-list-item span.val { color: #ffbc00; font-weight: 700; }
        [data-theme="light"] .esther-list-item span.val { color: #b45309; }
    </style>
</head>
<body>

<div class="calc-container">
    <div class="header-wrapper">
        <h1>아브렐슈드 EX 통합 지분 & 잔혈컷 계산기</h1>
        <div class="switch-wrapper">
            <span>다크</span>
            <label class="switch">
                <input type="checkbox" id="theme_toggle" onchange="toggleThemeSwitch()">
                <span class="slider"></span>
            </label>
            <span>화이트</span>
        </div>
    </div>
    
    <div class="tab-menu">
        <button class="tab-btn active nm" id="tab_nm" onclick="setDifficulty('nm')">나메</button>
        <button class="tab-btn" id="tab_hd" onclick="setDifficulty('hd')">하드</button>
        <button class="tab-btn" id="tab_nl" onclick="setDifficulty('nl')">노말</button>
    </div>
    
    <div class="calc-wrapper">
        <div class="input-section">
            <div class="section-header">
                <span class="section-title">📊 수치 입력</span>
                <button class="btn-reset" onclick="resetCalculator()">조건 초기화</button>
            </div>
            <hr style="border: 0; height: 1px; background: var(--border-color); margin-bottom: 20px;">
            
            <div class="input-group"><label>아제나 3칸 사용 횟수</label><div class="input-container"><input type="number" id="in_az3" value="3"></div></div>
            <div class="input-group"><label>아제나 1칸 사용 횟수</label><div class="input-container"><input type="number" id="in_az1" value="2"></div></div>
            <div class="input-group"><label>히든 아제나 사용 횟수</label><div class="input-container"><input type="number" id="in_azh" value="1"></div></div>
            <div class="input-group"><label>니나브 3칸 사용 횟수</label><div class="input-container"><input type="number" id="in_ni3" value="0"></div></div>
            <div class="input-group"><label>니나브 1칸 사용 횟수</label><div class="input-container"><input type="number" id="in_ni1" value="0"></div></div>
            <div class="input-group"><label>구스토 1칸 사용 횟수</label><div class="input-container"><input type="number" id="in_gs1" value="0"></div></div>
            <div class="input-group"><label>서포터 2명 딜량 합산 (억)</label><div class="input-container"><input type="number" id="in_sup" value="170"></div></div>
            <div class="input-group"><label>기타 변수 / 삑난 딜 (억)</label><div class="input-container"><input type="number" id="in_var" value="0"></div></div>
            
            <div class="notice-text">
                ※ 위의 에스더 택틱은 기본적인 에스더 사용 및 빗나감을 고려하여 가장 평균값에 근접한 택틱이라 기본값으로 책정 하였습니다. 임의로 수정가능합니다.
            </div>

            <div class="esther-info-box">
                <div class="esther-info-title" id="esther_title">나메 에스더 고유 딜량 요약</div>
                <div class="esther-vertical-list" id="esther_list_content">
                    </div>
            </div>
        </div>
        
        <div class="output-section">
           <div class="total-info">
    <div class="hp-header">
        <p>변경된 보스 체력</p>
    </div>

    <div class="hp-value">
        <span id="res_rem">0</span>
        <span class="unit">억</span>
    </div>
</div>
            
            <div class="result-title">🎯 ※ 에스더 및 서폿 입력 시 실시간 자동 갱신</div>
            <div class="result-list" id="res_list">
                </div>
        </div>
    </div>
</div>

<script>
    // --- 고정 데이터 세팅 ---
    const bossData = {
        nm: { name: "나메", total: 73669.66, az3: 1009, az1: 1135, azh: 4539, ni3: 743, ni1: 1185, gs1: 995, sup: 170.0 },
        hd: { name: "하드", total: 32449.52, az3: 451, az1: 508, azh: 1946, ni3: 320, ni1: 530, gs1: 445, sup: 120.0 },
        nl: { name: "노말", total: 11966.79, az3: 162, az1: 182, azh: 729, ni3: 119, ni1: 190, gs1: 159, sup: 80.0 }
    };

    let currentDiff = 'nm';

    function toggleThemeSwitch() {
        const isChecked = document.getElementById('theme_toggle').checked;
        if (isChecked) {
            document.documentElement.setAttribute('data-theme', 'light');
        } else {
            document.documentElement.removeAttribute('data-theme');
        }
        calculate();
    }

    function setDifficulty(diff) {
        currentDiff = diff;
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active', 'nm', 'hd', 'nl');
        });
        
        const activeTab = document.getElementById('tab_' + diff);
        activeTab.classList.add('active', diff);
        
        document.getElementById('in_sup').value = bossData[diff].sup;
        
        calculate();
    }

    function resetCalculator() {
        currentDiff = 'nm';
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active', 'nm', 'hd', 'nl'));
        document.getElementById('tab_nm').classList.add('active', 'nm');

        document.getElementById('in_az3').value = 3;
        document.getElementById('in_az1').value = 2;
        document.getElementById('in_azh').value = 1;
        document.getElementById('in_ni3').value = 0;
        document.getElementById('in_ni1').value = 0;
        document.getElementById('in_gs1').value = 0;
        document.getElementById('in_sup').value = 170;
        document.getElementById('in_var').value = 0;
        
        calculate();
    }

    function calculate() {
        const d = bossData[currentDiff];
        
        document.getElementById('esther_title').innerText = `${d.name} 에스더 고유 딜량 요약`;
        document.getElementById('esther_list_content').innerHTML = `
            <div class="esther-list-item"><span class="name">아제나 3칸</span><span class="val">${d.az3} 억</span></div>
            <div class="esther-list-item"><span class="name">아제나 1칸</span><span class="val">${d.az1} 억</span></div>
            <div class="esther-list-item"><span class="name">히든 아제나</span><span class="val">${d.azh} 억</span></div>
            <div class="esther-list-item"><span class="name">니나브 3칸</span><span class="val">${d.ni3} 억</span></div>
            <div class="esther-list-item"><span class="name">니나브 1칸</span><span class="val">${d.ni1} 억</span></div>
            <div class="esther-list-item"><span class="name">구스토 1칸</span><span class="val">${d.gs1} 억</span></div>
        `;
        
        const counts = {
            az3: Number(document.getElementById('in_az3').value),
            az1: Number(document.getElementById('in_az1').value),
            azh: Number(document.getElementById('in_azh').value),
            ni3: Number(document.getElementById('in_ni3').value),
            ni1: Number(document.getElementById('in_ni1').value),
            gs1: Number(document.getElementById('in_gs1').value),
            sup: Number(document.getElementById('in_sup').value),
            var: Number(document.getElementById('in_var').value)
        };

        const totalEsther = (counts.az3 * d.az3) + (counts.az1 * d.az1) + (counts.azh * d.azh) + 
                           (counts.ni3 * d.ni3) + (counts.ni1 * d.ni1) + (counts.gs1 * d.gs1);
        
        const totalDeduction = totalEsther + counts.sup + counts.var;
        const remaining = d.total - totalDeduction;

        document.getElementById('res_rem').innerText = Math.floor(remaining).toLocaleString();

        const listContainer = document.getElementById('res_list');
        listContainer.innerHTML = '';

        const percentages = [];
        for (let i = 10; i <= 25; i++) {
            percentages.push(i);
            if (i === 16) percentages.push(16.66);
        }

        percentages.forEach(pct => {
            const cutValue = remaining * (pct / 100);
            const item = document.createElement('div');
            item.className = 'result-item';
            
            if (pct === 15) {
                item.classList.add('highlight-15');
                item.innerHTML = `<span class="pct-num">15% (강투컷)</span> <span><b>${Math.floor(cutValue).toLocaleString()}</b> 억</span>`;
            } else if (pct === 16.66) {
                item.classList.add('highlight-1666');
                item.innerHTML = `<span class="pct-num">16.66% (1인분컷)</span> <span><b>${Math.floor(cutValue).toLocaleString()}</b> 억</span>`;
            } else if (pct === 20) {
                item.classList.add('highlight-20');
                item.innerHTML = `<span class="pct-num">20% (잔혈컷)</span> <span><b>${Math.floor(cutValue).toLocaleString()}</b> 억</span>`;
            } else {
                item.innerHTML = `<span class="pct-num">${pct}%</span> <span><b>${Math.floor(cutValue).toLocaleString()}</b> 억</span>`;
            }
            
            listContainer.appendChild(item);
        });
    }

    window.onload = () => {
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', calculate);
            // 마우스 스크롤 휠로도 수치가 자연스럽게 변경되도록 이벤트 바인딩 센스 추가
            input.addEventListener('wheel', function(e) {
                e.preventDefault();
                let step = Number(this.getAttribute('step')) || 1;
                if (e.deltaY < 0) {
                    this.value = Number(this.value) + step;
                } else {
                    this.value = Math.max(0, Number(this.value) - step);
                }
                calculate();
            });
        });
        calculate();
    };
</script>

</body>
</html>
