<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>승률 기록표</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      color: #f4f7fc;
      background:
        radial-gradient(circle at top, rgba(122,255,174,0.08), transparent 36%),
        linear-gradient(180deg, #0b1017, #111827 48%, #0b1017);
      padding: 24px;
    }

    .wrap { max-width: 1600px; margin: 0 auto; }

    .history-modal {
      width: 100%;
      min-height: 860px;
      display: grid;
      grid-template-columns: 300px 1fr;
      background: rgba(17, 24, 36, 0.95);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 30px 90px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .left-panel {
      border-right: 1px solid rgba(255,255,255,0.06);
      background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015));
      display: flex;
      flex-direction: column;
    }

    .left-head {
      padding: 20px 18px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .left-head h2 { margin: 0 0 8px; font-size: 19px; font-weight: 900; }
    .left-head p { margin: 0; color: #92a0b6; font-size: 13px; line-height: 1.5; }

    .selected-tags {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; min-height: 34px;
    }

    .tag {
      padding: 7px 10px; border-radius: 999px; font-size: 12px; font-weight: 800;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .search-box {
      padding: 10px 10px 0;
    }

    .search-box input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #101723;
      color: #eef4ff;
      font-size: 13px;
      outline: none;
    }

    .engraving-list {
      padding: 10px;
      overflow-y: auto;
      flex: 1;
      max-height: 660px;
    }

    .engraving-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 12px; border-radius: 12px; margin-bottom: 6px;
      background: rgba(255,255,255,0.02); border: 1px solid transparent;
      cursor: pointer; transition: .18s ease;
    }

    .engraving-item:hover {
      background: rgba(126,255,174,0.07); border-color: rgba(126,255,174,0.14);
    }

    .engraving-item.checked {
      background: rgba(126,255,174,0.1); border-color: rgba(126,255,174,0.22);
    }

    .engraving-item input {
      width: 18px; height: 18px; accent-color: #7effae; flex: 0 0 auto; cursor: pointer;
    }

    .engraving-name { font-size: 14px; font-weight: 800; color: #edf4ff; }
    .engraving-class { font-size: 11px; color: #8a97ad; margin-left: auto; }

    .main-panel { display: flex; flex-direction: column; min-width: 0; }

    .controls {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      display: flex; flex-wrap: wrap; gap: 12px; align-items: end;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; font-weight: 800; color: #9eabc0; }

    .field input, .field select {
      min-width: 150px; padding: 10px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08); background: #101723; color: #eef4ff; outline: none;
    }

    .confirm-btn {
      border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 900;
      background: linear-gradient(135deg, #7effae, #59c7ff); color: #07111a;
      cursor: pointer; box-shadow: 0 12px 28px rgba(89,199,255,0.18);
    }

    .confirm-btn:hover { filter: brightness(1.05); }

    .confirm-btn:disabled {
      opacity: 0.5; cursor: not-allowed; filter: none;
    }

    .notice {
      padding: 12px 20px 4px; color: #94a4bc; font-size: 13px;
    }

    .content-area { padding: 14px 18px 18px; display: grid; gap: 16px; }

    .chart-card, .table-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.07); border-radius: 18px; padding: 16px;
    }

    .chart-card h3, .table-card h3 { margin: 0 0 6px; font-size: 17px; font-weight: 900; }
    .chart-card p, .table-card p { margin: 0 0 14px; color: #99a6bc; font-size: 13px; }

    .chart-wrap {
      width: 100%; overflow: hidden; border-radius: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)), #0f1520;
      border: 1px solid rgba(255,255,255,0.05); position: relative;
    }

    #chartSvg { width: 100%; height: 380px; display: block; }

    .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }

    .legend-item {
      display: flex; align-items: center; gap: 7px;
      color: #dce9ff; font-size: 12px; font-weight: 800;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      padding: 7px 10px; border-radius: 999px;
    }

    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }

    .tooltip {
      position: absolute; display: none; pointer-events: none;
      background: rgba(10, 14, 22, 0.96); border: 1px solid rgba(126,255,174,0.2);
      color: #eef5ff; font-size: 12px; font-weight: 700; border-radius: 10px;
      padding: 10px 12px; z-index: 10; white-space: nowrap;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .mini-table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; min-width: 760px; }

    thead th {
      text-align: left; font-size: 12px; color: #a6b2c5;
      padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); white-space: nowrap;
    }

    tbody td {
      padding: 11px 12px; border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 13px; color: #edf3ff; white-space: nowrap;
    }

    tbody tr:hover { background: rgba(255,255,255,0.025); }

    .color-chip {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; margin-right: 8px; vertical-align: middle;
    }

    .muted { color: #7a8a9f; }

    .loading-overlay {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: rgba(15,21,32,0.85); border-radius: 14px;
      color: #9fb5d0; font-size: 15px; font-weight: 800;
      z-index: 5;
    }

    @media (max-width: 1100px) {
      .history-modal { grid-template-columns: 1fr; }
      .left-panel { border-right: 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
      .engraving-list { max-height: 300px; }
      #chartSvg { height: 300px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="history-modal">
      <aside class="left-panel">
        <div class="left-head">
          <h2>직업 각인 선택</h2>
          <p>체크박스로 보고 싶은 각인을 선택하세요. (최대 5개)</p>
          <div class="selected-tags" id="selectedTags"></div>
        </div>

        <div class="search-box">
          <input type="text" id="searchInput" placeholder="각인 검색...">
        </div>

        <div class="engraving-list" id="engravingList">
          <div class="muted" style="padding:20px; text-align:center;">로딩 중...</div>
        </div>
      </aside>

      <section class="main-panel">
        <div class="controls">
          <div class="field">
            <label>모드</label>
            <select id="modeSelect">
              <option value="op">OP</option>
              <option value="favor">호감</option>
            </select>
          </div>

          <div class="field">
            <label>시작일</label>
            <input type="date" id="startDate" min="2026-04-07">
          </div>

          <div class="field">
            <label>종료일</label>
            <input type="date" id="endDate" min="2026-04-07">
          </div>

          <button class="confirm-btn" id="applyBtn">확인</button>
        </div>

        <div class="notice" id="noticeText">
          각인을 선택하고 날짜를 지정한 뒤 확인을 눌러주세요.
        </div>

        <div class="content-area">
          <div class="chart-card">
            <h3>일별 승률 추이</h3>
            <p>선택한 각인의 날짜별 승률 변화를 보여줍니다. 점에 마우스를 올려보세요.</p>

            <div class="chart-wrap" id="chartWrap">
              <svg id="chartSvg" viewBox="0 0 1000 380" preserveAspectRatio="none"></svg>
              <div class="tooltip" id="tooltip"></div>
            </div>

            <div class="legend" id="legendBox"></div>
          </div>

          <div class="table-card">
            <h3>선택 각인 요약</h3>
            <p>기간 내 시작/종료/최고/평균 승률</p>

            <div class="mini-table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>각인</th>
                    <th>클래스</th>
                    <th>시작 승률</th>
                    <th>종료 승률</th>
                    <th>최고 승률</th>
                    <th>평균 승률</th>
                    <th>총 경기</th>
                  </tr>
                </thead>
                <tbody id="summaryBody">
                  <tr><td colspan="7" class="muted">조회 결과가 여기에 표시됩니다.</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    // ==============================
    // Supabase 설정
    // ==============================
    const SUPABASE_URL = "https://khszfukekudyripouifm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_XjCVKOZRq1aERqzOGj_tHw_eC4uCXEb";

    async function callRpc(fnName, params) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        },
        body: JSON.stringify(params)
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`RPC ${fnName} 실패: ${res.status} ${errText}`);
      }

      return await res.json();
    }

    // ==============================
    // 상수
    // ==============================
    const COLORS = [
      "#7effae", "#59c7ff", "#ffb86b", "#d48fff", "#ffd85c",
      "#72f0de", "#ff7fa5", "#8fa7ff", "#7ce4ff", "#ffa76c"
    ];

    const MAX_SELECT = 5;

    // 직각명 → 줄임명 매핑
    const SHORT_NAMES = {
      "전투 태세": "전태", "고독한 기사": "고기", "광기": "광기", "광전사의 비기": "비기",
      "분노의 망치": "분망", "중력 수련": "중수", "포식자": "포식",
      "오의 강화": "오의", "초심": "초심", "체술": "체술", "충단": "충단",
      "세맥타통": "세맥", "역천지체": "역천",
      "절정": "절정", "절제": "절제",
      "권왕파천무": "권왕", "수라의 길": "수라",
      "일격필살": "일격", "오의난무": "오난",
      "강화 무기": "강무", "핸드거너": "핸건",
      "화력 강화": "화강", "포격 강화": "포강",
      "사냥의 시간": "사시", "피스메이커": "피메",
      "죽음의 습격": "죽습", "아르데타인의 기술": "아르데",
      "진화의 유산": "진유", "아르데타인의 기술": "아르데",
      "두 번째 동료": "두동",
      "점화": "점화", "환류": "환류",
      "넘치는 교감": "교감", "상급 소환사": "상소",
      "황제의 칙령": "황제", "황후의 은총": "황후",
      "잔재된 기운": "잔재", "버스트": "버스트",
      "완벽한 억제": "억제", "멈출 수 없는 충동": "충동",
      "갈증": "갈증", "달의 소리": "달소",
      "만월의 집행자": "만월", "그믐의 경계": "그믐",
      "리퍼": "리퍼", "탈출의 명수": "탈명", "감행": "감행",
      "피스메이커": "피메",
      "그림자": "그림자",
      "야성": "야성", "쿠나이": "쿠나이",
      "절실한 구원": "절구", "축복의 오라": "축오",
      "해방자": "해방자", "만개": "만개",
      "빛의 기사": "빛기사",
      "발키리": "발키리",
      "회귀": "회귀", "만개": "만개",
      "처단자": "처단", "포식자": "포식"
    };

    function getShortName(fullName) {
      return SHORT_NAMES[fullName] || fullName;
    }

    // ==============================
    // DOM
    // ==============================
    const engravingListEl = document.getElementById("engravingList");
    const selectedTagsEl = document.getElementById("selectedTags");
    const searchInput = document.getElementById("searchInput");
    const startDateEl = document.getElementById("startDate");
    const endDateEl = document.getElementById("endDate");
    const modeSelectEl = document.getElementById("modeSelect");
    const applyBtn = document.getElementById("applyBtn");
    const chartSvg = document.getElementById("chartSvg");
    const chartWrap = document.getElementById("chartWrap");
    const legendBox = document.getElementById("legendBox");
    const summaryBody = document.getElementById("summaryBody");
    const tooltip = document.getElementById("tooltip");
    const noticeText = document.getElementById("noticeText");

    // ==============================
    // 선택 상태 관리
    // ==============================
    let allCandidates = [];
    const selectedEngravingSet = new Set();

    // 선택 순서 유지용 배열
    let selectedOrder = [];

    function getColorForEngraving(name) {
      const idx = selectedOrder.indexOf(name);
      if (idx === -1) return COLORS[0];
      return COLORS[idx % COLORS.length];
    }

    // ==============================
    // 날짜 초기화 (어제까지만)
    // ==============================
    function initDates() {
      const today = new Date();
      const yesterday = new Date(today);
      yesterday.setDate(today.getDate() - 1);

      const tenDaysAgo = new Date(yesterday);
      tenDaysAgo.setDate(yesterday.getDate() - 9);

      const minDate = new Date("2026-04-07");
      const start = tenDaysAgo < minDate ? minDate : tenDaysAgo;

      startDateEl.value = formatDateISO(start);
      endDateEl.value = formatDateISO(yesterday);

      startDateEl.max = formatDateISO(yesterday);
      endDateEl.max = formatDateISO(yesterday);
    }

    function formatDateISO(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${dd}`;
    }

    // ==============================
    // 각인 목록 로드
    // ==============================
    async function loadCandidates() {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/candidates?enabled=eq.true&select=class_name,engraving_name&order=class_name.asc,engraving_name.asc`,
          {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        if (!res.ok) throw new Error("candidates 로드 실패");

        allCandidates = await res.json();
        renderEngravingList();
      } catch (err) {
        engravingListEl.innerHTML = `<div class="muted" style="padding:20px; text-align:center;">각인 목록 로드 실패: ${err.message}</div>`;
      }
    }

    function renderEngravingList(filter = "") {
      const filtered = filter
        ? allCandidates.filter(c =>
            c.engraving_name.includes(filter) || c.class_name.includes(filter)
          )
        : allCandidates;

      if (!filtered.length) {
        engravingListEl.innerHTML = `<div class="muted" style="padding:20px; text-align:center;">검색 결과 없음</div>`;
        return;
      }

      engravingListEl.innerHTML = filtered.map(c => {
        const checked = selectedEngravingSet.has(c.engraving_name) ? "checked" : "";
        return `
          <label class="engraving-item ${checked ? 'checked' : ''}">
            <input type="checkbox" value="${c.engraving_name}" ${checked}
                   data-class="${c.class_name}">
            <span class="engraving-name">${c.engraving_name}</span>
            <span class="engraving-class">${c.class_name}</span>
          </label>
        `;
      }).join("");

      engravingListEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener("change", onCheckboxChange);
      });
    }

    // ==============================
    // 선택 관련 함수
    // ==============================
    function getSelectedEngravings() {
      return Array.from(selectedOrder);
    }

    function getSelectedWithClass() {
      return selectedOrder.map(name => {
        const found = allCandidates.find(c => c.engraving_name === name);
        return {
          engraving_name: name,
          class_name: found ? found.class_name : ""
        };
      });
    }

    function onCheckboxChange(e) {
      const name = e.target.value;

      if (e.target.checked) {
        if (selectedEngravingSet.size >= MAX_SELECT) {
          e.target.checked = false;
          alert(`최대 ${MAX_SELECT}개까지 선택 가능합니다.`);
          return;
        }
        selectedEngravingSet.add(name);
        selectedOrder.push(name);
      } else {
        selectedEngravingSet.delete(name);
        selectedOrder = selectedOrder.filter(n => n !== name);
      }

      e.target.closest(".engraving-item").classList.toggle("checked", e.target.checked);
      updateSelectedTags();
    }

    function updateSelectedTags() {
      const selected = getSelectedEngravings();
      if (!selected.length) {
        selectedTagsEl.innerHTML = '<span class="tag" style="color:#7a8a9f; background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.08);">선택 없음</span>';
        return;
      }
      selectedTagsEl.innerHTML = selected.map(name => {
        const color = getColorForEngraving(name);
        return `<span class="tag" style="color:${color}; background:${color}18; border-color:${color}40;">${name}</span>`;
      }).join("");
    }

    searchInput.addEventListener("input", () => {
      renderEngravingList(searchInput.value.trim());
    });

    // ==============================
    // 데이터 조회 + 차트 그리기
    // ==============================
    applyBtn.addEventListener("click", fetchAndRender);

    async function fetchAndRender() {
      const selected = getSelectedEngravings();
      const startStr = startDateEl.value;
      const endStr = endDateEl.value;
      const mode = modeSelectEl.value;

      if (!startStr || !endStr) return alert("시작일과 종료일을 입력해줘.");
      if (startStr > endStr) return alert("시작일이 종료일보다 늦을 수 없어.");
      if (!selected.length) return alert("최소 1개 각인을 선택해줘.");

      applyBtn.disabled = true;
      applyBtn.textContent = "조회 중...";

      const loadingDiv = document.createElement("div");
      loadingDiv.className = "loading-overlay";
      loadingDiv.textContent = "데이터 불러오는 중...";
      chartWrap.appendChild(loadingDiv);

      try {
        const data = await callRpc("get_daily_winrate_history", {
          p_type: mode,
          p_start: startStr,
          p_end: endStr
        });

        const filteredData = data.filter(row => selected.includes(row.engraving_name));

        const dates = [...new Set(data.map(r => r.date_key))].sort();

        const datasets = selected.map((name, idx) => {
          const rows = filteredData.filter(r => r.engraving_name === name);
          const classInfo = getSelectedWithClass().find(c => c.engraving_name === name);

          const values = dates.map(d => {
            const match = rows.find(r => r.date_key === d);
            return match && match.win_rate !== null ? parseFloat(match.win_rate) : null;
          });

          const totalMatches = rows.reduce((sum, r) => sum + (parseInt(r.total_matches) || 0), 0);

          return {
            name,
            shortName: getShortName(name),
            class_name: classInfo ? classInfo.class_name : "",
            color: COLORS[idx % COLORS.length],
            values,
            totalMatches
          };
        });

        const labels = dates.map(d => {
          const parts = d.split("-");
          return `${parseInt(parts[1])}/${parseInt(parts[2])}`;
        });

        renderSvgChart(datasets, labels, dates);
        renderLegend(datasets);
        renderSummaryTable(datasets, labels, startStr, endStr);

        noticeText.textContent =
          `${mode === "op" ? "OP" : "호감"} · ${startStr} ~ ${endStr} · ${selected.length}개 각인 조회 완료`;

      } catch (err) {
        alert("조회 실패: " + err.message);
        console.error(err);
      } finally {
        applyBtn.disabled = false;
        applyBtn.textContent = "확인";
        const overlay = chartWrap.querySelector(".loading-overlay");
        if (overlay) overlay.remove();
      }
    }

    // ==============================
    // SVG 차트 렌더링
    // ==============================
    function renderSvgChart(datasets, labels, dates) {
      const W = 1000;
      const H = 380;
      const pad = { top: 28, right: 30, bottom: 46, left: 60 };
      const plotW = W - pad.left - pad.right;
      const plotH = H - pad.top - pad.bottom;

      let allValues = [];
      datasets.forEach(ds => {
        ds.values.forEach(v => { if (v !== null) allValues.push(v); });
      });

      if (!allValues.length) {
        chartSvg.innerHTML = `
          <rect width="${W}" height="${H}" fill="#0f1520"/>
          <text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#7a8a9f" font-size="15" font-weight="700">
            선택한 기간에 데이터가 없습니다.
          </text>
        `;
        return;
      }

      let yMinRaw = Math.floor(Math.min(...allValues) - 5);
      let yMaxRaw = Math.ceil(Math.max(...allValues) + 5);
      yMinRaw = Math.max(0, yMinRaw);
      yMaxRaw = Math.min(100, yMaxRaw);

      if (yMaxRaw - yMinRaw < 10) {
        yMinRaw = Math.max(0, yMinRaw - 5);
        yMaxRaw = Math.min(100, yMaxRaw + 5);
      }

      function xScale(i) {
        if (labels.length === 1) return pad.left + plotW / 2;
        return pad.left + (plotW * i / (labels.length - 1));
      }

      function yScale(v) {
        return pad.top + ((yMaxRaw - v) / (yMaxRaw - yMinRaw)) * plotH;
      }

      let svg = `<rect width="${W}" height="${H}" fill="#0f1520"/>`;

      // Y축 그리드 + 라벨
      const yTickCount = 5;
      const yStep = (yMaxRaw - yMinRaw) / yTickCount;

      for (let i = 0; i <= yTickCount; i++) {
        const val = yMinRaw + yStep * i;
        const y = yScale(val);
        svg += `<line x1="${pad.left}" y1="${y}" x2="${W - pad.right}" y2="${y}" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>`;
        svg += `<text x="${pad.left - 10}" y="${y + 4}" text-anchor="end" fill="#94a3b8" font-size="11" font-weight="700">${Math.round(val)}%</text>`;
      }

      // 축선
      svg += `<line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${H - pad.bottom}" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>`;
      svg += `<line x1="${pad.left}" y1="${H - pad.bottom}" x2="${W - pad.right}" y2="${H - pad.bottom}" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>`;

      // X축 날짜 라벨
      const maxLabels = 20;
      const labelStep = labels.length <= maxLabels ? 1 : Math.ceil(labels.length / maxLabels);

      labels.forEach((label, i) => {
        if (i % labelStep !== 0 && i !== labels.length - 1) return;
        const x = xScale(i);
        svg += `<text x="${x}" y="${H - 18}" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700">${label}</text>`;
      });

      // 데이터 라인 + 점 + 시작점 줄임명
      datasets.forEach(ds => {
        const points = [];
        ds.values.forEach((v, i) => {
          if (v !== null) {
            points.push({ x: xScale(i), y: yScale(v), label: labels[i], value: v, date: dates[i] });
          }
        });

        if (points.length > 1) {
          const pathD = points.map((p, i) => (i === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(" ");
          svg += `<path d="${pathD}" fill="none" stroke="${ds.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
        }

        // 시작점 왼쪽에 줄임명 표시
        if (points.length > 0) {
          const firstPt = points[0];
          svg += `<text x="${firstPt.x - 8}" y="${firstPt.y + 4}" text-anchor="end" fill="${ds.color}" font-size="10" font-weight="800" opacity="0.85">${ds.shortName}</text>`;
        }

        points.forEach(pt => {
          const safeName = ds.name.replace(/"/g, '&quot;');
          svg += `
            <circle cx="${pt.x}" cy="${pt.y}" r="5" fill="${ds.color}" stroke="#0f1520" stroke-width="2.5"
              data-name="${safeName}" data-label="${pt.label}" data-value="${pt.value}" data-date="${pt.date}"
              style="cursor:pointer"/>
          `;
        });
      });

      chartSvg.innerHTML = svg;

      // 이벤트
      chartSvg.querySelectorAll("circle").forEach(circle => {
        circle.addEventListener("mousemove", (e) => {
          const name = circle.getAttribute("data-name");
          const label = circle.getAttribute("data-label");
          const value = circle.getAttribute("data-value");
          const date = circle.getAttribute("data-date");
          showTooltip(e, `<strong>${name}</strong><br>${label} (${date})<br>승률 ${value}%`);
        });
        circle.addEventListener("mouseleave", hideTooltip);

        circle.addEventListener("mouseenter", () => {
          circle.setAttribute("r", "7");
        });
        circle.addEventListener("mouseleave", () => {
          circle.setAttribute("r", "5");
        });
      });
    }

    // ==============================
    // 툴팁
    // ==============================
    function showTooltip(event, html) {
      const rect = chartWrap.getBoundingClientRect();
      tooltip.style.display = "block";
      tooltip.innerHTML = html;

      let left = event.clientX - rect.left + 16;
      let top = event.clientY - rect.top - 12;

      if (left + 180 > rect.width) left = event.clientX - rect.left - 180;
      if (top < 0) top = 10;

      tooltip.style.left = left + "px";
      tooltip.style.top = top + "px";
    }

    function hideTooltip() {
      tooltip.style.display = "none";
    }

    // ==============================
    // 범례
    // ==============================
    function renderLegend(datasets) {
      legendBox.innerHTML = datasets.map(ds => `
        <div class="legend-item">
          <span class="legend-dot" style="background:${ds.color}"></span>
          ${ds.name}
        </div>
      `).join("");
    }

    // ==============================
    // 요약 테이블
    // ==============================
    function renderSummaryTable(datasets, labels, startStr, endStr) {
      if (!datasets.length) {
        summaryBody.innerHTML = `<tr><td colspan="7" class="muted">선택된 각인이 없습니다.</td></tr>`;
        return;
      }

      summaryBody.innerHTML = datasets.map(ds => {
        const valid = ds.values.filter(v => v !== null);

        if (!valid.length) {
          return `
            <tr>
              <td><span class="color-chip" style="background:${ds.color}"></span>${ds.name}</td>
              <td>${ds.class_name}</td>
              <td colspan="5" class="muted">데이터 없음</td>
            </tr>
          `;
        }

        const first = valid[0];
        const last = valid[valid.length - 1];
        const max = Math.max(...valid);
        const avg = valid.reduce((a, b) => a + b, 0) / valid.length;

        return `
          <tr>
            <td><span class="color-chip" style="background:${ds.color}"></span>${ds.name}</td>
            <td>${ds.class_name}</td>
            <td>${first.toFixed(1)}%</td>
            <td>${last.toFixed(1)}%</td>
            <td>${max.toFixed(1)}%</td>
            <td>${avg.toFixed(1)}%</td>
            <td>${ds.totalMatches.toLocaleString()}</td>
          </tr>
        `;
      }).join("");
    }

    // ==============================
    // 초기화
    // ==============================
    initDates();
    loadCandidates();
  </script>
</body>
</html>
