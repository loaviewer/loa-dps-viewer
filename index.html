<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로아 딜지분</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f5f5;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }
    .app {
      width: 960px;
      margin: 10px auto;
      border: 4px solid #111;
      background: #fff;
      min-height: 620px;
      padding: 18px;
    }
    .layout {
      display: grid;
      grid-template-columns: 260px 1fr 210px;
      gap: 18px;
    }
    .left {
      display: flex;
      flex-direction: column;
      gap: 34px;
      margin-top: 24px;
    }
    .menu-btn {
      border: 5px solid #111;
      background: #fff;
      min-height: 78px;
      font-size: 20px;
      font-weight: 700;
      text-align: left;
      padding: 14px;
      cursor: pointer;
    }
    .menu-btn.active {
      border-color: #ffe600;
    }
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .tabs {
      display: flex;
      gap: 16px;
      margin-top: 22px;
      margin-bottom: 8px;
    }
    .tab {
      min-width: 84px;
      height: 40px;
      border-radius: 12px;
      background: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      border: 4px solid #aaa;
    }
    .tab.normal { border-color: #b7e61f; }
    .tab.hard { border-color: #ff7f2a; }
    .tab.nightmare { border-color: #a54aa8; }
    .tab.active {
      transform: translateY(-2px);
    }
    .table-title {
      width: 100%;
      max-width: 360px;
      text-align: center;
      background: #f6b68d;
      border: 1px solid #333;
      border-bottom: none;
      font-size: 18px;
      font-weight: 800;
      padding: 4px 0;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 360px;
      background: #fffaf5;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #333;
      text-align: center;
      padding: 3px 6px;
    }
    thead th {
      background: #f6b68d;
      font-weight: 800;
    }
    .subhead {
      background: #ffd2b3;
      font-weight: 700;
    }
    .row-30 td { background: #f4dc8a; }
    .row-33 td { background: #9ae3c3; }
    .row-40 td { background: #d7a2e8; }
    .right {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      margin-top: 128px;
    }
    .box-title {
      width: 170px;
      height: 58px;
      border: 5px solid #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: #fff;
    }
    .time-box {
      width: 190px;
      border: 5px solid #111;
      border-radius: 18px;
      background: white;
      padding: 18px 14px 12px;
      text-align: center;
    }
    .time-display {
      font-size: 22px;
      color: #666;
      margin-bottom: 10px;
    }
    .time-inputs {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .time-inputs input {
      width: 60px;
      font-size: 18px;
      text-align: center;
      padding: 6px;
    }
    .base-time {
      font-size: 15px;
      color: #444;
      margin-top: 10px;
    }
    .underline {
      width: 90px;
      height: 4px;
      background: #111;
      margin: 6px auto 0;
    }
    .refresh-btn {
      width: 160px;
      height: 82px;
      border: 5px solid #111;
      background: white;
      font-size: 24px;
      color: #5b6f8a;
      cursor: pointer;
    }
    .status {
      margin-top: 8px;
      font-size: 13px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="layout">
      <div class="left">
        <button class="menu-btn active" data-menu="serka">세르카 딜지분 보기</button>
        <button class="menu-btn" data-menu="cathedral">성당 딜지분 보기</button>
        <button class="menu-btn" data-menu="gato1730">1730 가토 딜지분 보기</button>
        <button class="menu-btn" data-menu="gato1750">1750 가토 딜지분 보기</button>
      </div>

      <div class="center">
        <div class="tabs">
          <button class="tab normal" data-diff="normal">노말</button>
          <button class="tab hard active" data-diff="hard">하드</button>
          <button class="tab nightmare" data-diff="nightmare">나메</button>
        </div>

        <div class="table-title" id="tableTitle">하드 (1730)</div>

        <table>
          <thead>
            <tr>
              <th rowspan="2">딜지분</th>
              <th colspan="2">1관</th>
              <th colspan="2">2관</th>
            </tr>
            <tr class="subhead">
              <th>딜량/억</th>
              <th>DPS</th>
              <th>딜량/억</th>
              <th>DPS</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div class="status" id="status">불러오는 중...</div>
      </div>

      <div class="right">
        <div class="box-title">클리어시간</div>

        <div class="time-box">
          <div class="time-display" id="timeDisplay">06 분 00 초</div>
          <div class="time-inputs">
            <input type="number" id="minutes" value="6" min="0" />
            <input type="number" id="seconds" value="0" min="0" max="59" />
          </div>
          <div class="base-time">기본값 6분</div>
          <div class="underline"></div>
        </div>

        <button class="refresh-btn" id="refreshBtn">갱신하기</button>
      </div>
    </div>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/1v4gfG-Lr0iFmiP0PXtVTsijdMziekQaZ-wBTWrobncY/export?format=csv&gid=0";

    let currentMenu = "serka";
    let currentDiff = "hard";
    let parsedData = {
      serka: { normal: [], hard: [], nightmare: [] },
      cathedral: { normal: [], hard: [], nightmare: [] }
    };

    function formatNumber(n) {
      return Number(String(n).replace(/,/g, "")).toLocaleString("ko-KR");
    }

    function getTimeSeconds() {
      const min = parseInt(document.getElementById("minutes").value || 0, 10);
      const sec = parseInt(document.getElementById("seconds").value || 0, 10);
      return Math.max(1, min * 60 + sec);
    }

    function updateTimeDisplay() {
      const min = parseInt(document.getElementById("minutes").value || 0, 10);
      const sec = parseInt(document.getElementById("seconds").value || 0, 10);
      document.getElementById("timeDisplay").textContent =
        `${String(min).padStart(2, "0")} 분 ${String(sec).padStart(2, "0")} 초`;
    }

    function getTitle(menu, diff) {
      if (menu === "serka") {
        if (diff === "normal") return "노말 (1710)";
        if (diff === "hard") return "하드 (1730)";
        return "나메 (1740)";
      }
      if (menu === "cathedral") {
        if (diff === "normal") return "1단계 (1700)";
        if (diff === "hard") return "2단계 (1720)";
        return "3단계 (1750)";
      }
      return "준비중";
    }

    function renderTable() {
      updateTimeDisplay();
      document.getElementById("tableTitle").textContent = getTitle(currentMenu, currentDiff);

      const body = document.getElementById("tableBody");
      const rows = parsedData[currentMenu]?.[currentDiff] || [];
      const totalSeconds = getTimeSeconds();

      if (!rows.length) {
        body.innerHTML = `<tr><td colspan="5">데이터 없음</td></tr>`;
        return;
      }

      body.innerHTML = rows.map(row => {
        const dps1 = (row.g1 / totalSeconds).toFixed(1);
        const dps2 = (row.g2 / totalSeconds).toFixed(1);

        let cls = "";
        if (row.share === 30) cls = "row-30";
        if (row.share === 33) cls = "row-33";
        if (row.share === 40) cls = "row-40";

        return `
          <tr class="${cls}">
            <td>${row.share}%</td>
            <td>${formatNumber(row.g1)}</td>
            <td>${dps1}</td>
            <td>${formatNumber(row.g2)}</td>
            <td>${dps2}</td>
          </tr>
        `;
      }).join("");
    }

    function parseCSVLine(line) {
      return line.split(",");
    }

    function toNum(v) {
      return Number(String(v).replace(/,/g, "").trim());
    }

    function loadCSV() {
      document.getElementById("status").textContent = "시트 불러오는 중...";
      fetch(CSV_URL)
        .then(res => res.text())
        .then(text => {
          const lines = text.split(/\r?\n/).map(v => v.trimEnd());
          parseSheet(lines);
          renderTable();
          document.getElementById("status").textContent = "연동 완료";
        })
        .catch(err => {
          console.error(err);
          document.getElementById("status").textContent = "불러오기 실패";
        });
    }

    function parseSheet(lines) {
      parsedData = {
        serka: { normal: [], hard: [], nightmare: [] },
        cathedral: { normal: [], hard: [], nightmare: [] }
      };

      parseSerka(lines);
      parseCathedral(lines);
    }

    function parsePercent(v) {
      const m = String(v).match(/(\d+)%/);
      return m ? Number(m[1]) : null;
    }

    function parseSerka(lines) {
      for (let i = 0; i < lines.length; i++) {
        const row = parseCSVLine(lines[i]);
        if ((row[1] || "").includes("노말 (1710)")) {
          for (let r = i + 3; r < i + 29; r++) {
            const cols = parseCSVLine(lines[r] || "");
            const share = parsePercent(cols[1]);
            if (!share) continue;

            parsedData.serka.normal.push({
              share,
              g1: toNum(cols[2]),
              g2: toNum(cols[4])
            });
            parsedData.serka.hard.push({
              share,
              g1: toNum(cols[7]),
              g2: toNum(cols[9])
            });
            parsedData.serka.nightmare.push({
              share,
              g1: toNum(cols[12]),
              g2: toNum(cols[14])
            });
          }
          break;
        }
      }
    }

    function parseCathedral(lines) {
      for (let i = 0; i < lines.length; i++) {
        const row = parseCSVLine(lines[i]);
        if ((row[1] || "").includes("1단계 (1700)")) {
          for (let r = i + 3; r < i + 29; r++) {
            const cols = parseCSVLine(lines[r] || "");
            const share = parsePercent(cols[1]);
            if (!share) continue;

            parsedData.cathedral.normal.push({
              share,
              g1: toNum(cols[2]),
              g2: toNum(cols[4])
            });
            parsedData.cathedral.hard.push({
              share,
              g1: toNum(cols[7]),
              g2: toNum(cols[9])
            });
            parsedData.cathedral.nightmare.push({
              share,
              g1: toNum(cols[12]),
              g2: toNum(cols[14])
            });
          }
          break;
        }
      }
    }

    document.querySelectorAll(".menu-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".menu-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentMenu = btn.dataset.menu;
        renderTable();
      });
    });

    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentDiff = btn.dataset.diff;
        renderTable();
      });
    });

    document.getElementById("refreshBtn").addEventListener("click", loadCSV);
    document.getElementById("minutes").addEventListener("input", renderTable);
    document.getElementById("seconds").addEventListener("input", renderTable);

    loadCSV();
  </script>
</body>
</html>
