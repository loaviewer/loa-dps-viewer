<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로아 딜지분</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background:
        radial-gradient(circle at top, rgba(255,210,120,0.12), transparent 30%),
        linear-gradient(180deg, #101722 0%, #0b1018 45%, #070b12 100%);
      color: #f3e7c2;
    }

    .app {
      width: min(1380px, calc(100% - 20px));
      margin: 24px auto 10px;
      padding: 22px 22px 28px;
      border: 1px solid rgba(255, 215, 140, 0.25);
      background: rgba(10, 14, 22, 0.88);
      box-shadow:
        0 0 0 1px rgba(255,215,140,0.08) inset,
        0 20px 60px rgba(0,0,0,0.45);
      border-radius: 24px;
      backdrop-filter: blur(8px);
      overflow: hidden;
    }

    .footer-signature {
      width: min(1380px, calc(100% - 20px));
      margin: 0 auto 18px;
      text-align: center;
      user-select: none;
    }

    .footer-signature span {
      display: inline-block;
      padding: 7px 18px 8px;
      border-radius: 999px;
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 20px;
      font-style: italic;
      letter-spacing: 0.8px;
      color: rgba(255, 228, 188, 0.92);
      border-top: 1px solid rgba(255,223,170,0.20);
      border-bottom: 1px solid rgba(255,223,170,0.08);
      background: linear-gradient(180deg, rgba(255,255,255,0.018), rgba(255,214,153,0.028));
      text-shadow:
        0 0 2px rgba(255,255,255,0.18),
        0 0 8px rgba(255,210,120,0.12),
        0 0 16px rgba(255,180,90,0.06);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.02) inset,
        0 0 18px rgba(255,190,100,0.05);
      opacity: 0.9;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      min-height: 56px;
    }

    .top-spacer {
      min-width: 0;
    }

    .top-title {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #f6d18b;
      text-shadow: 0 0 18px rgba(246, 209, 139, 0.18);
      margin: 0;
      white-space: nowrap;
    }

    .top-datetime {
      justify-self: end;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      color: #e2d2a9;
      letter-spacing: 0.6px;
      opacity: 0.95;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,214,153,0.16);
      background: rgba(255,255,255,0.04);
      white-space: nowrap;
    }

    .layout {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr) 240px;
      gap: 18px;
      align-items: start;
    }

    .panel {
      min-width: 0;
      background: linear-gradient(180deg, rgba(28,36,50,0.92), rgba(16,22,32,0.92));
      border: 1px solid rgba(255, 214, 153, 0.18);
      border-radius: 20px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 12px 30px rgba(0,0,0,0.35);
    }

    .left, .center, .right {
      padding: 18px;
    }

    .menu-title,
    .side-title {
      font-size: 13px;
      color: #cfae69;
      letter-spacing: 2px;
      margin-bottom: 14px;
      opacity: 0.9;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-btn {
      width: 100%;
      border: 1px solid rgba(255,214,153,0.2);
      background: linear-gradient(180deg, rgba(61, 76, 102, 0.28), rgba(21, 28, 39, 0.88));
      color: #f5e7c5;
      min-height: 72px;
      border-radius: 16px;
      font-size: 19px;
      font-weight: 700;
      text-align: left;
      padding: 16px 18px;
      cursor: pointer;
      transition: 0.18s ease;
      box-shadow: 0 6px 16px rgba(0,0,0,0.22);
    }

    .menu-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(255,214,153,0.45);
    }

    .menu-btn.active {
      border-color: rgba(255, 214, 153, 0.8);
      background: linear-gradient(180deg, rgba(138, 108, 51, 0.35), rgba(44, 34, 18, 0.95));
      box-shadow:
        0 0 0 1px rgba(255,220,160,0.12) inset,
        0 0 18px rgba(255,196,92,0.14);
    }

    .center-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .content-title {
      font-size: 26px;
      font-weight: 800;
      color: #f4ddb0;
      line-height: 1.2;
      word-break: keep-all;
    }

    .title-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      min-height: 24px;
    }

    .content-sub {
      font-size: 13px;
      color: #b9a98b;
      margin-top: 4px;
      min-height: 18px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      max-width: 880px;
    }

    .tab {
      position: relative;
      min-width: 122px;
      min-height: 52px;
      padding: 8px 14px;
      border-radius: 18px;
      border: 1px solid rgba(255,214,153,0.28);
      background: rgba(255,255,255,0.03);
      color: #e8dcc0;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.18s ease;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-align: center;
      overflow: hidden;
    }

    .tab:hover {
      transform: translateY(-1px);
      border-color: rgba(255,214,153,0.5);
    }

    .tab.active {
      color: #1a140a;
      transform: translateY(-1px) scale(1.03);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.25) inset,
        0 0 18px rgba(255, 214, 153, 0.25);
    }

    .tab.gato {
      min-width: 128px;
      min-height: 64px;
      padding: 9px 10px;
      font-size: 14px;
      flex: 0 0 auto;
      color: #f4e7c9;
      background:
        linear-gradient(180deg, rgba(52, 63, 82, 0.75), rgba(25, 31, 43, 0.95));
      border: 1px solid rgba(255, 209, 138, 0.3);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.02) inset,
        0 6px 18px rgba(0,0,0,0.18);
    }

    .tab.gato .tab-label {
      color: #f5e7c8;
      text-shadow: 0 1px 0 rgba(0,0,0,0.35);
    }

    .tab.gato.active {
      color: #fff6e4;
      border-color: rgba(255, 224, 170, 0.88);
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 228, 165, 0.34), rgba(255,228,165,0.08) 42%, transparent 72%),
        linear-gradient(180deg, rgba(118, 96, 61, 0.92), rgba(62, 50, 31, 0.96));
      box-shadow:
        0 0 0 1px rgba(255,248,220,0.22) inset,
        0 0 10px rgba(255, 220, 150, 0.18),
        0 0 22px rgba(255, 214, 140, 0.28),
        0 0 42px rgba(255, 199, 112, 0.18);
    }

    .tab.gato.active::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 24%, rgba(255, 244, 210, 0.22), transparent 34%),
        linear-gradient(180deg, rgba(255,255,255,0.08), transparent 55%);
      pointer-events: none;
    }

    .tab.gato.active::after {
      content: "✓";
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 14px;
      font-weight: 900;
      color: #fff3d1;
      text-shadow:
        0 0 4px rgba(255,255,255,0.4),
        0 0 10px rgba(255,214,153,0.45);
      opacity: 0.92;
      pointer-events: none;
    }

    .tab.gato.active .tab-label {
      color: #fff6e9 !important;
      text-shadow:
        0 0 4px rgba(255,255,255,0.18),
        0 1px 0 rgba(0,0,0,0.28) !important;
    }

    .tab.gato.active .tab-meta {
      background: rgba(24, 20, 13, 0.28);
      border-radius: 999px;
      padding: 3px 6px;
    }

    .tab.combo {
      min-width: 118px;
      min-height: 60px;
      padding: 8px 10px;
      font-size: 13px;
    }

    .tab-label { line-height: 1.1; }

    .tab-sub {
      font-size: 11px;
      opacity: 0.92;
      line-height: 1;
    }

    .tab.active .tab-label,
    .tab.active .tab-sub {
      color: #241700;
      text-shadow: 0 1px 0 rgba(255,255,255,0.35);
    }

    .tab-meta {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      min-height: 18px;
    }

    .tab.active .tab-meta {
      margin-top: 4px;
      padding: 3px 6px;
      border-radius: 999px;
      background: rgba(18, 24, 35, 0.18);
    }

    .tab-tier-normal {
      border-color: rgba(170, 235, 160, 0.32);
      background: linear-gradient(180deg, rgba(124, 172, 112, 0.18), rgba(28, 42, 28, 0.88));
    }

    .tab-tier-normal:hover {
      border-color: rgba(184, 255, 170, 0.6);
    }

    .tab-tier-normal.active {
      background: linear-gradient(180deg, #b9ef98, #79c96a);
      border-color: rgba(220, 255, 205, 0.95);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.25) inset,
        0 0 18px rgba(153, 230, 134, 0.45);
    }

    .tab-tier-hard {
      border-color: rgba(255, 206, 140, 0.34);
      background: linear-gradient(180deg, rgba(177, 124, 70, 0.18), rgba(46, 31, 18, 0.9));
    }

    .tab-tier-hard:hover {
      border-color: rgba(255, 216, 160, 0.62);
    }

    .tab-tier-hard.active {
      background: linear-gradient(180deg, #ffd79d, #e3a85a);
      border-color: rgba(255, 233, 196, 0.95);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.25) inset,
        0 0 18px rgba(255, 193, 110, 0.45);
    }

    .tab-tier-nightmare {
      border-color: rgba(214, 180, 255, 0.34);
      background: linear-gradient(180deg, rgba(129, 91, 177, 0.18), rgba(36, 25, 49, 0.9));
    }

    .tab-tier-nightmare:hover {
      border-color: rgba(228, 196, 255, 0.62);
    }

    .tab-tier-nightmare.active {
      background: linear-gradient(180deg, #e5c0ff, #be89eb);
      border-color: rgba(243, 224, 255, 0.95);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.25) inset,
        0 0 18px rgba(198, 141, 255, 0.45);
    }

    .table-wrap {
      overflow-x: auto;
      overflow-y: hidden;
      border-radius: 18px;
      border: 1px solid rgba(255,214,153,0.18);
      background: rgba(9, 13, 20, 0.55);
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      font-size: 15px;
      table-layout: fixed;
    }

    thead th {
      background: linear-gradient(180deg, rgba(157,115,58,0.95), rgba(107,72,34,0.95));
      color: #fff3d7;
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255,224,177,0.18);
    }

    tbody td {
      padding: 10px 10px;
      text-align: center;
      color: #f3ead8;
      border-top: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.015);
      vertical-align: middle;
    }

    tbody tr:hover td {
      background: rgba(255,255,255,0.05);
    }

    .row-30 td { background: rgba(245, 166, 35, 0.18); }
    .row-33 td { background: rgba(61, 195, 145, 0.18); }
    .row-40 td { background: rgba(158, 107, 214, 0.22); }

    .share-cell {
      color: #ffe8b3 !important;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 0.2px;
      text-align: left;
      padding: 10px 12px;
    }

    .share-row {
      display: grid;
      grid-template-columns: 54px 1fr;
      align-items: center;
      column-gap: 8px;
      min-height: 22px;
    }

    .share-label {
      font-size: 12px;
      font-weight: 800;
      text-align: left;
      white-space: nowrap;
      opacity: 0.95;
    }

    .label-30 { color: #ffcf7a; }
    .label-33 { color: #8ef0c9; }
    .label-40 { color: #d8b2ff; }

    .share-value {
      font-size: 15px;
      font-weight: 900;
      text-align: left;
      white-space: nowrap;
    }

    .dps-cell {
      font-weight: 800;
      color: #ffd58c;
    }

    .status {
      text-align: right;
      margin-top: 10px;
      font-size: 13px;
      color: #a7987d;
    }

    .right {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .side-box {
      width: 100%;
      padding: 16px;
      border-radius: 18px;
      border: 1px solid rgba(255,214,153,0.16);
      background: rgba(255,255,255,0.03);
      margin-bottom: 0;
      overflow: hidden;
    }

    .time-view {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      color: #f4ddb0;
      margin: 8px 0 16px;
      letter-spacing: 1px;
    }

    .time-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .time-inputs input {
      width: 70px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(255,214,153,0.22);
      background: rgba(0,0,0,0.24);
      color: #f8edd1;
      font-size: 20px;
      text-align: center;
      outline: none;
    }

    .time-labels {
      text-align: center;
      font-size: 13px;
      color: #b6a483;
      margin-bottom: 10px;
      word-break: keep-all;
    }

    .auto-refresh {
      text-align: center;
      font-size: 14px;
      color: #8ef0c9;
      font-weight: 700;
      letter-spacing: 0.5px;
      opacity: 0.92;
    }

    .hint {
      font-size: 13px;
      color: #a9997e;
      line-height: 1.5;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 20px;
      padding: 0 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid rgba(255,255,255,0.12);
      line-height: 1;
      white-space: nowrap;
    }

    .attr-dark { background: rgba(126, 87, 194, 0.22); color: #dab8ff; }
    .attr-earth { background: rgba(121, 85, 72, 0.24); color: #e0c2a8; }
    .attr-lightning { background: rgba(255, 214, 10, 0.22); color: #ffe98f; }
    .attr-holy { background: rgba(255, 236, 179, 0.20); color: #fff2b0; }
    .attr-fire { background: rgba(255, 112, 67, 0.22); color: #ffbfaa; }
    .attr-none { background: rgba(255,255,255,0.08); color: #d1d5db; }

    .type-human { background: rgba(100, 181, 246, 0.18); color: #bfe1ff; }
    .type-ancient { background: rgba(186, 104, 200, 0.18); color: #edc6ff; }
    .type-beast { background: rgba(141, 110, 99, 0.22); color: #e4c9bb; }
    .type-insect { background: rgba(174, 213, 129, 0.20); color: #e2f5bf; }
    .type-spirit { background: rgba(128, 222, 234, 0.18); color: #c6f7ff; }

    .tab.active .badge {
      background: rgba(18, 24, 35, 0.72) !important;
      color: #fff4de !important;
      border-color: rgba(255,255,255,0.18) !important;
      box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset;
    }

    .tab.gato .badge {
      border-color: rgba(255,255,255,0.08);
    }

    .tab.gato.active .badge {
      background: rgba(49, 38, 21, 0.72) !important;
      color: #fff5dd !important;
      border-color: rgba(255,239,204,0.15) !important;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.10) inset,
        0 0 8px rgba(255,210,120,0.08);
    }

    .coming-soon {
      padding: 44px 20px;
      text-align: center;
      border-radius: 18px;
      border: 1px dashed rgba(255,214,153,0.26);
      background: rgba(255,255,255,0.03);
      color: #e8dcc0;
    }

    .coming-soon h3 {
      margin: 0 0 10px;
      color: #f6d18b;
      font-size: 24px;
    }

    .coming-soon p {
      margin: 0;
      color: #b9a98b;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 220px minmax(0, 1fr) 220px;
      }

      .tab.combo {
        min-width: 110px;
      }
    }

    @media (max-width: 1024px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .top-bar {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
        gap: 10px;
      }

      .top-spacer {
        display: none;
      }

      .top-title {
        white-space: normal;
      }

      .top-datetime {
        justify-self: center;
      }

      .left, .center, .right {
        padding: 14px;
      }

      .menu-list {
        gap: 10px;
      }

      .menu-btn {
        min-height: 58px;
        font-size: 17px;
        padding: 12px 14px;
      }

      .content-title {
        font-size: 22px;
      }

      .tabs {
        justify-content: flex-start;
        max-width: 100%;
      }

      .tab {
        min-width: 104px;
        font-size: 14px;
      }

      .tab.gato {
        min-width: 118px;
        min-height: 58px;
        font-size: 13px;
      }

      .tab.combo {
        min-width: 104px;
        min-height: 56px;
        font-size: 12px;
      }

      .time-view {
        font-size: 26px;
      }
    }

    @media (max-width: 768px) {
      .app {
        width: calc(100% - 12px);
        margin: 8px auto 8px;
        padding: 10px;
        border-radius: 16px;
      }

      .footer-signature {
        width: calc(100% - 12px);
        margin-bottom: 14px;
      }

      .footer-signature span {
        font-size: 17px;
        padding: 6px 14px 7px;
      }

      .top-title {
        width: 100%;
        font-size: 21px;
        line-height: 1.2;
        text-align: center;
      }

      .top-datetime {
        font-size: 12px;
        padding: 8px 10px;
        text-align: center;
      }

      .center-top {
        gap: 12px;
        margin-bottom: 12px;
      }

      .title-row {
        gap: 8px;
      }

      .title-meta {
        gap: 4px;
      }

      .content-title {
        font-size: 18px;
      }

      .content-sub {
        font-size: 12px;
      }

      .menu-title,
      .side-title {
        font-size: 11px;
        margin-bottom: 10px;
      }

      .menu-btn {
        min-height: 52px;
        font-size: 16px;
        padding: 10px 12px;
        border-radius: 14px;
      }

      .tabs {
        gap: 8px;
      }

      .tab {
        min-width: 94px;
        min-height: 42px;
        padding: 6px 10px;
        font-size: 12px;
        border-radius: 14px;
      }

      .tab.gato {
        min-width: 108px;
        min-height: 54px;
        font-size: 12px;
        padding: 6px 8px;
      }

      .tab.combo {
        min-width: 92px;
        min-height: 52px;
        font-size: 11px;
        padding: 6px 8px;
      }

      .tab-sub {
        font-size: 10px;
      }

      .tab-meta {
        gap: 3px;
      }

      .badge {
        font-size: 9px;
        height: 16px;
        padding: 0 5px;
      }

      .table-wrap {
        overflow-x: hidden;
      }

      table {
        min-width: 100%;
        width: 100%;
        table-layout: fixed;
        font-size: 12px;
      }

      thead th,
      tbody td {
        padding: 7px 4px;
      }

      thead th:nth-child(1),
      tbody td:nth-child(1) {
        width: 34%;
      }

      thead th:nth-child(2),
      tbody td:nth-child(2) {
        width: 33%;
      }

      thead th:nth-child(3),
      tbody td:nth-child(3) {
        width: 33%;
      }

      .share-cell {
        padding: 6px 6px;
        font-size: 12px;
      }

      .share-row {
        grid-template-columns: 42px 1fr;
        column-gap: 4px;
      }

      .share-label {
        font-size: 10px;
      }

      .share-value {
        font-size: 12px;
      }

      .dps-cell {
        font-size: 12px;
        font-weight: 800;
      }

      .time-view {
        font-size: 24px;
      }

      .time-inputs input {
        width: 64px;
        height: 40px;
        font-size: 18px;
      }

      .hint {
        font-size: 12px;
      }
    }

    @media (max-width: 480px) {
      .top-title {
        font-size: 18px;
      }

      .content-title {
        font-size: 16px;
      }

      .content-sub {

      },
      cathedral: {

        normal_gate2: { diffKey: "normal", gateKey: "gate2", title: "1단계 (1700)", gateName: "2관", type: { text: "인간", cls: "type-human" }, attr: { text: "암속성 취약", cls: "attr-dark" }, tierClass: "tab-tier-normal" },
        hard_gate1: { diffKey: "hard", gateKey: "gate1", title: "2단계 (1720)", gateName: "1관", type: { text: "인간", cls: "type-human" }, attr: { text: "암속성 취약", cls: "attr-dark" }, tierClass: "tab-tier-hard" },
        hard_gate2: { diffKey: "hard", gateKey: "gate2", title: "2단계 (1720)", gateName: "2관", type: { text: "인간", cls: "type-human" }, attr: { text: "암속성 취약", cls: "attr-dark" }, tierClass: "tab-tier-hard" },
        nightmare_gate1: { diffKey: "nightmare", gateKey: "gate1", title: "3단계 (1750)", gateName: "1관", type: { text: "인간", cls: "type-human" }, attr: { text: "암속성 취약", cls: "attr-dark" }, tierClass: "tab-tier-nightmare" },
        nightmare_gate2: { diffKey: "nightmare", gateKey: "gate2", title: "3단계 (1750)", gateName: "2관", type: { text: "인간", cls: "type-human" }, attr: { text: "암속성 취약", cls: "attr-dark" }, tierClass: "tab-tier-nightmare" }
      }
    };

    function formatDateTime(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      const h = String(date.getHours()).padStart(2, "0");
      const min = String(date.getMinutes()).padStart(2, "0");
      const s = String(date.getSeconds()).padStart(2, "0");
      return `${y} / ${m} / ${d}  ${h}:${min}:${s}`;
    }

    function updateTopDateTime() {
      document.getElementById("topDateTime").textContent = formatDateTime(new Date());
    }

    function makeBadge(text, cls) {
      return `<span class="badge ${cls}">${text}</span>`;
    }

    function updateTimeDisplay() {
      const min = parseInt(document.getElementById("minutes").value || 0, 10);
      const sec = parseInt(document.getElementById("seconds").value || 0, 10);
      document.getElementById("timeDisplay").textContent =
        `${String(min).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
    }

    function setBaseTimeByMenu(menu) {
      const minInput = document.getElementById("minutes");
      const secInput = document.getElementById("seconds");
      const label = document.getElementById("timeBaseLabel");

      if (menu === "gato1730") {
        minInput.value = 1;
        secInput.value = 50;
        label.textContent = "기본값 1분 50초(110초)";
      } else {
        minInput.value = 10;
        secInput.value = 0;
        label.textContent = "기본값 10분(600초)";
      }
      updateTimeDisplay();
    }

    function getTotalSeconds() {
      const min = parseInt(document.getElementById("minutes").value || 0, 10);
      let sec = parseInt(document.getElementById("seconds").value || 0, 10);

      if (sec > 59) sec = 59;
      if (sec < 0) sec = 0;
      document.getElementById("seconds").value = sec;

      return Math.max(1, min * 60 + sec);
    }

    function fmt(n) {
      return Number(n || 0).toLocaleString("ko-KR");
    }

    function toNum(v) {
      if (v === undefined || v === null) return 0;
      const s = String(v).replace(/,/g, "").replace(/"/g, "").trim();
      const n = Number(s);
      return isNaN(n) ? 0 : n;
    }

    function parseCSVLine(line) {
      const result = [];
      let cur = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          result.push(cur);
          cur = "";
        } else {
          cur += ch;
        }
      }
      result.push(cur);
      return result;
    }

    function percentNum(v) {
      const m = String(v || "").match(/(\d+)%/);
      return m ? Number(m[1]) : null;
    }

    function getComboTabs(menu) {
      if (menu === "serka") {
        return [
          { key: "normal_gate1", label: "노말", sub: "1관" },
          { key: "normal_gate2", label: "노말", sub: "2관" },
          { key: "hard_gate1", label: "하드", sub: "1관" },
          { key: "hard_gate2", label: "하드", sub: "2관" },
          { key: "nightmare_gate1", label: "나메", sub: "1관" },
          { key: "nightmare_gate2", label: "나메", sub: "2관" }
        ];
      }

      if (menu === "cathedral") {
        return [
          { key: "normal_gate1", label: "1단계", sub: "1관" },
          { key: "normal_gate2", label: "1단계", sub: "2관" },
          { key: "hard_gate1", label: "2단계", sub: "1관" },
          { key: "hard_gate2", label: "2단계", sub: "2관" },
          { key: "nightmare_gate1", label: "3단계", sub: "1관" },
          { key: "nightmare_gate2", label: "3단계", sub: "2관" }
        ];
      }

      return [];
    }

    function getContentName() {
      if (currentMenu === "serka" || currentMenu === "cathedral") {
        const meta = raidMeta[currentMenu][currentCombo];
        const menuName = currentMenu === "serka" ? "세르카" : "성당";
        return `${menuName} : ${meta.title.replace(/\s*\(.+\)/, "")} ${meta.gateName}`;
      }
      if (currentMenu === "gato1730") return `1730 가디언 토벌 : ${currentGatoBoss}`;
      if (currentMenu === "gato1750") return "1750 가디언 토벌";
      return "콘텐츠";
    }

    function getTableTitle() {
      if (currentMenu === "serka" || currentMenu === "cathedral") {
        const meta = raidMeta[currentMenu][currentCombo];
        const levelMatch = meta.title.match(/\((\d+)\)/);
        const level = levelMatch ? levelMatch[1] : "-";
        return `입장레벨 : ${level}`;
      }

      if (currentMenu === "gato1730") return "잔영 1단계";
      if (currentMenu === "gato1750") return "데이터 준비중";
      return "";
    }

    function renderTitleMeta() {
      const titleMeta = document.getElementById("titleMeta");

      if (currentMenu === "serka" || currentMenu === "cathedral") {
        const meta = raidMeta[currentMenu][currentCombo];
        titleMeta.innerHTML = `
          ${makeBadge(meta.type.text, meta.type.cls)}
          ${makeBadge(meta.attr.text, meta.attr.cls)}
        `;
        return;
      }

      if (currentMenu === "gato1730") {
        const meta = gatoMeta[currentGatoBoss];
        titleMeta.innerHTML = `
          ${makeBadge(meta.type.text, meta.type.cls)}
          ${makeBadge(meta.attr.text, meta.attr.cls)}
        `;
        return;
      }

      titleMeta.innerHTML = "";
    }

    function renderTabs() {
      const tabs = document.getElementById("tabs");

      if (currentMenu === "gato1730") {
        tabs.innerHTML = gato1730Bosses.map(name => {
          const meta = gatoMeta[name];
          return `
            <button class="tab gato ${currentGatoBoss === name ? 'active' : ''}" data-boss="${name}">
              <div class="tab-label">${name}</div>
              <div class="tab-meta">
                ${makeBadge(meta.type.text, meta.type.cls)}
                ${makeBadge(meta.attr.text, meta.attr.cls)}
              </div>
            </button>
          `;
        }).join("");

        tabs.querySelectorAll(".tab[data-boss]").forEach(btn => {
          btn.addEventListener("click", () => {
            currentGatoBoss = btn.dataset.boss;
            renderTabs();
            renderTable();
          });
        });
        return;
      }

      if (currentMenu === "gato1750") {
        tabs.innerHTML = "";
        return;
      }

      const comboTabs = getComboTabs(currentMenu);
      tabs.innerHTML = comboTabs.map(item => {
        const meta = raidMeta[currentMenu][item.key];
        return `
          <button class="tab combo ${meta.tierClass} ${currentCombo === item.key ? 'active' : ''}" data-combo="${item.key}">
            <div class="tab-label">${item.label}</div>
            <div class="tab-sub">${item.sub}</div>
          </button>
        `;
      }).join("");

      tabs.querySelectorAll(".tab[data-combo]").forEach(btn => {
        btn.addEventListener("click", () => {
          currentCombo = btn.dataset.combo;
          renderTabs();
          renderTable();
        });
      });
    }

    function clearAllData() {
      parsedData.serka = { normal: [], hard: [], nightmare: [] };
      parsedData.cathedral = { normal: [], hard: [], nightmare: [] };
      parsedData.gato1730 = {};
      parsedData.gato1750 = {};
    }

    function parseBlock(lines, startRow, type) {
      for (let r = startRow + 3; r < startRow + 29; r++) {
        const cols = parseCSVLine(lines[r] || "");
        const share = percentNum(cols[1]);
        if (!share) continue;

        parsedData[type].normal.push({
          share,
          g1: toNum(cols[3]),
          g2: toNum(cols[6])
        });

        parsedData[type].hard.push({
          share,
          g1: toNum(cols[11]),
          g2: toNum(cols[14])
        });

        parsedData[type].nightmare.push({
          share,
          g1: toNum(cols[19]),
          g2: toNum(cols[22])
        });
      }
    }

    function parseCathedral(lines) {
      for (let i = 0; i < lines.length; i++) {
        if ((lines[i] || "").includes("지평의 성당 1~3단계 딜지분 상세")) {
          parseBlock(lines, i + 1, "cathedral");
          return;
        }
      }
    }

    function parseSerka(lines) {
      for (let i = 0; i < lines.length; i++) {
        if ((lines[i] || "").includes("세르카 딜지분 상세")) {
          parseBlock(lines, i + 1, "serka");
          return;
        }
      }
    }

    function parseGato1730(lines) {
      gato1730Bosses.forEach(name => {
        parsedData.gato1730[name] = [];
      });

      gato1730Layout.forEach(info => {
        for (let r = info.startRow + 3; r <= info.startRow + 28; r++) {
          const cols = parseCSVLine(lines[r] || "");
          const share = percentNum(cols[info.shareCol]);
          if (!share) continue;

          parsedData.gato1730[info.boss].push({
            share,
            damage: toNum(cols[info.damageCol])
          });
        }
      });
    }

              <span class="share-label label-40">잔혈컷</span>
              <span class="share-value">40%</span>
            </div>
          </td>
        `;
      }

      return `
        <td class="share-cell">
          <div class="share-row">
            <span class="share-label"></span>
            <span class="share-value">${share}%</span>
          </div>
        </td>
      `;
    }

        head.innerHTML = `
          <tr>
            <th>딜지분</th>
            <th>피해/억</th>
            <th>DPS</th>
          </tr>
        `;
        return;
      }

      if (currentMenu === "gato1750") {
        head.innerHTML = "";
        return;

      head.innerHTML = `
        <tr>
          <th>딜지분</th>
          <th>피해/억</th>
          <th>DPS</th>
        </tr>
      `;
    }

      const mainContent = document.getElementById("mainContent");
      mainContent.innerHTML = `
        <div class="coming-soon">
          <h3>1750 가토 준비중</h3>
          <p>해당 구간 데이터는 아직 시트에 반영되지 않았습니다.<br>데이터 추가 후 동일한 형식으로 연동됩니다.</p>
        </div>
      `;
    }

      const mainContent = document.getElementById("mainContent");

        <div class="table-wrap" id="tableWrap">
          <table id="dataTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      `;

      updateTimeDisplay();

      document.getElementById("contentTitle").textContent = getContentName();
      document.getElementById("tableTitle").textContent = getTableTitle();
      renderTitleMeta();

      if (currentMenu === "gato1750") {
        renderComingSoon();
        document.getElementById("infoHint").innerHTML =
          "1750 가디언 토벌 데이터는 현재 준비중입니다.<br>시트 반영 후 자동으로 확장 가능합니다.";
        return;
      }

      ensureTableWrap();
      renderHead();

      document.getElementById("infoHint").innerHTML =
        "구글 시트 데이터를 읽어옵니다.<br>시간 변경 시 DPS는 자동 계산됩니다.";

      const body = document.getElementById("tableBody");
      const totalSeconds = getTotalSeconds();

      if (currentMenu === "gato1730") {
        const rows = parsedData.gato1730[currentGatoBoss] || [];

        if (!rows.length) {
          body.innerHTML = `<tr><td colspan="3">데이터 없음</td></tr>`;
          return;
        }

        body.innerHTML = rows.map(row => {
          let cls = "";
          if (row.share === 30) cls = "row-30";
          if (row.share === 33) cls = "row-33";
          if (row.share === 40) cls = "row-40";

          return `
            <tr class="${cls}">
              ${renderShareCell(row.share)}
              <td>${fmt(row.damage)}</td>
              <td class="dps-cell">${(row.damage / totalSeconds).toFixed(1)}</td>
            </tr>
          `;
        }).join("");
        return;
      }

      const meta = raidMeta[currentMenu][currentCombo];
      const rows = parsedData[currentMenu]?.[meta.diffKey] || [];

      if (!rows.length) {
        body.innerHTML = `<tr><td colspan="3">데이터 없음</td></tr>`;
        return;
      }

      body.innerHTML = rows.map(row => {
        let cls = "";
        if (row.share === 30) cls = "row-30";
        if (row.share === 33) cls = "row-33";
        if (row.share === 40) cls = "row-40";

        const damage = meta.gateKey === "gate1" ? row.g1 : row.g2;
        const dps = (damage / totalSeconds).toFixed(1);

        return `
          <tr class="${cls}">
            ${renderShareCell(row.share)}
            <td>${fmt(damage)}</td>
            <td class="dps-cell">${dps}</td>
          </tr>
        `;
      }).join("");
    }

    async function loadCSV() {
      document.getElementById("status").textContent = "시트 불러오는 중...";
      try {
        const res = await fetch(CSV_URL);
        const text = await res.text();
        const lines = text.split(/\r?\n/);

        clearAllData();
        parseCathedral(lines);
        parseSerka(lines);
        parseGato1730(lines);

        renderTabs();
        renderTable();
        document.getElementById("status").textContent = "연동 완료";
      } catch (e) {
        console.error(e);
        document.getElementById("status").textContent = "불러오기 실패";
      }
    }

    document.querySelectorAll(".menu-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".menu-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        currentMenu = btn.dataset.menu;

        if (currentMenu === "serka") {
          currentCombo = "hard_gate1";
        } else if (currentMenu === "cathedral") {
          currentCombo = "hard_gate1";
        } else if (currentMenu === "gato1730") {
          currentGatoBoss = "루멘칼리고";
        }

        setBaseTimeByMenu(currentMenu);
        renderTabs();
        renderTable();
      });
    });

    document.getElementById("minutes").addEventListener("input", renderTable);
    document.getElementById("seconds").addEventListener("input", renderTable);

    updateTopDateTime();
    setInterval(updateTopDateTime, 1000);

    setBaseTimeByMenu("serka");
    loadCSV();
  </script>
</body>
</html>
