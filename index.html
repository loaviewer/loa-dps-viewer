      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      const h = String(date.getHours()).padStart(2, "0");
      const min = String(date.getMinutes()).padStart(2, "0");
      const s = String(date.getSeconds()).padStart(2, "0");
      return `${y} / ${m} / ${d}  ${h}:${min}:${s}`;
    }

      let sec = parseInt(document.getElementById("seconds").value || 0, 10);

      if (isNaN(sec) || sec < 0) sec = 0;
      if (sec > 59) sec = 59;

      document.getElementById("minutes").value = min;
      document.getElementById("seconds").value = sec;

      document.getElementById("timeDisplay").textContent =
        `${String(min).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;

      if (isNaN(sec) || sec < 0) sec = 0;
      if (sec > 59) sec = 59;

      document.getElementById("minutes").value = min;
      document.getElementById("seconds").value = sec;

      if (v === undefined || v === null) return 0;
      const s = String(v).replace(/,/g, "").replace(/"/g, "").trim();
      const n = Number(s);
      return isNaN(n) ? 0 : n;
    }

    function parseCSVLine(line) {
      const result = [];
      let cur = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          result.push(cur);
          cur = "";
        } else {
          cur += ch;
        }
      }
      result.push(cur);
      return result;
    }

                ${makeBadge(meta.attr.text, meta.attr.cls)}
              </div>
              ${isAvailable ? '' : '<div class="tab-pending">준비중</div>'}
            </button>
          `;
        }).join("");

        tabs.querySelectorAll(".tab[data-boss1750]").forEach(btn => {
          btn.addEventListener("click", () => {
            currentGato1750Boss = btn.dataset.boss1750;

            trackEvent(
              `/이벤트/가토/잔영2단계/${currentGato1750Boss}`,
              `보스 클릭 - 잔영 2단계 ${currentGato1750Boss}`
            );

            renderTabs();
            renderTable();
          });
        });
        return;
      }

      const comboTabs = getComboTabs(currentMenu);
      tabs.innerHTML = comboTabs.map(item => {
        const meta = raidMeta[currentMenu][item.key];
        return `
          <button class="tab ${meta.tierClass} ${currentCombo === item.key ? 'active' : ''}" data-combo="${item.key}">
            <div class="tab-label">${item.label}</div>
            <div class="tab-sub">${item.sub}</div>
          </button>
        `;
      }).join("");

      tabs.querySelectorAll(".tab[data-combo]").forEach(btn => {
        btn.addEventListener("click", () => {
          currentCombo = btn.dataset.combo;

          const meta = raidMeta[currentMenu][currentCombo];
          const menuName = currentMenu === "serka" ? "세르카" : "성당";
          const tabName = `${meta.title.replace(/\s*\(.+\)/, "")}_${meta.gateName}`;

          trackEvent(
            `/이벤트/탭/${menuName}/${tabName}`,
            `탭 클릭 - ${menuName} ${meta.title.replace(/\s*\(.+\)/, "")} ${meta.gateName}`
          );

          renderTabs();
          renderTable();
        });
      });
    }

    function clearAllData() {
      parsedData.serka = { normal: [], hard: [], nightmare: [] };
      parsedData.cathedral = { normal: [], hard: [], nightmare: [] };
      parsedData.gato1730 = {};
      parsedData.gato1750 = {};
    }

    function parseBlock(lines, startRow, type) {
      for (let r = startRow + 3; r < startRow + 29; r++) {
        const cols = parseCSVLine(lines[r] || "");
        const share = percentNum(cols[1]);
        if (!share) continue;

        parsedData[type].normal.push({
          share,
          g1: toNum(cols[3]),
          g2: toNum(cols[6])
        });

        parsedData[type].hard.push({
          share,
          g1: toNum(cols[11]),
          g2: toNum(cols[14])
        });

        parsedData[type].nightmare.push({
          share,
          g1: toNum(cols[19]),
          g2: toNum(cols[22])
        });
      }
    }

    function parseCathedral(lines) {
      for (let i = 0; i < lines.length; i++) {
        if ((lines[i] || "").includes("지평의 성당 1~3단계 딜지분 상세")) {
          parseBlock(lines, i + 1, "cathedral");
          return;
        }
      }
    }

    function parseSerka(lines) {
      for (let i = 0; i < lines.length; i++) {
        if ((lines[i] || "").includes("세르카 딜지분 상세")) {
          parseBlock(lines, i + 1, "serka");
          return;
        }
      }
    }

    function parseGato1730(lines) {
      gato1730Bosses.forEach(name => {
        parsedData.gato1730[name] = [];
      });

      gato1730Layout.forEach(info => {
        for (let r = info.startRow + 3; r <= info.startRow + 28; r++) {
          const cols = parseCSVLine(lines[r] || "");
          const share = percentNum(cols[info.shareCol]);
          if (!share) continue;

          parsedData.gato1730[info.boss].push({
            share,
            damage: toNum(cols[info.damageCol])
          });
        }
      });
    }

    function parseGato1750(lines) {
      gato1750Bosses.forEach(name => {
        parsedData.gato1750[name] = [];
      });

      gato1750Layout.forEach(info => {
        for (let r = info.startRow + 3; r <= info.startRow + 28; r++) {
          const cols = parseCSVLine(lines[r] || "");
          const share = percentNum(cols[info.shareCol]);
          if (!share) continue;

          parsedData.gato1750[info.boss].push({
            share,
            damage: toNum(cols[info.damageCol])
          });
        }
      });
    }

    function renderShareCell(share) {
      if (share === 30) {
        return `
          <td class="share-cell">
            <div class="share-row">
              <span class="share-label label-30">강투컷</span>
              <span class="share-value">30%</span>
            </div>
          </td>
        `;
      }
      if (share === 33) {
        return `
          <td class="share-cell">
            <div class="share-row">
              <span class="share-label label-33">1인분</span>
              <span class="share-value">33%</span>
            </div>
          </td>
        `;
      }
      if (share === 40) {
        return `
          <td class="share-cell">
            <div class="share-row">
              <span class="share-label label-40">잔혈컷</span>
              <span class="share-value">40%</span>
            </div>
          </td>
        `;
      }

      return `
        <td class="share-cell">
          <div class="share-row">
            <span class="share-label"></span>
            <span class="share-value">${share}%</span>
          </div>
        </td>
      `;
    }

    function renderHead() {
      const head = document.getElementById("tableHead");
      head.innerHTML = `
        <tr>
          <th>딜지분</th>
          <th>피해/억</th>
          <th>DPS</th>
        </tr>
      `;
    }

    function renderComingSoon(messageTitle, messageDesc) {
      const mainContent = document.getElementById("mainContent");
      mainContent.innerHTML = `
        <div class="coming-soon">
          <h3>${messageTitle}</h3>
          <p>${messageDesc}</p>
        </div>
      `;
    }

    function ensureTableWrap() {
      const mainContent = document.getElementById("mainContent");
      mainContent.innerHTML = `
        <div class="table-wrap" id="tableWrap">
          <table id="dataTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      `;
    }

    function getCurrentRowsForPartyDps() {
      if (currentMenu === "gato1730") {
        return parsedData.gato1730[currentGatoBoss] || [];
      }

      if (currentMenu === "gato1750") {
        if (!isGato1750Available(currentGato1750Boss)) return [];
        return parsedData.gato1750[currentGato1750Boss] || [];
      }

      const meta = raidMeta[currentMenu][currentCombo];
      return parsedData[currentMenu]?.[meta.diffKey] || [];
    }

    function getDamageFromRow(row) {
      if (!row) return 0;

      if (currentMenu === "gato1730" || currentMenu === "gato1750") {
        return row.damage || 0;
      }

      const meta = raidMeta[currentMenu][currentCombo];
      return meta.gateKey === "gate1" ? (row.g1 || 0) : (row.g2 || 0);
    }

    function getPartyDpsValue() {
      const rows = getCurrentRowsForPartyDps();
      if (!rows.length) return null;

      const preferredShares = [33, 30, 40];
      let baseRow = null;

      for (const share of preferredShares) {
        baseRow = rows.find(row => row.share === share && getDamageFromRow(row) > 0);
        if (baseRow) break;
      }

      if (!baseRow) {
        baseRow = rows.find(row => getDamageFromRow(row) > 0) || null;
      }

      if (!baseRow) return null;

      const damage = getDamageFromRow(baseRow);
      const shareRate = (baseRow.share || 0) / 100;
      if (!damage || !shareRate) return null;

      const totalDamage = damage / shareRate;
      const totalSeconds = getTotalSeconds();
      return totalDamage / totalSeconds;
    }

    function updatePartyDpsDisplay() {
      const el = document.getElementById("partyDpsDisplay");

      if (currentMenu === "gato1750" && !isGato1750Available(currentGato1750Boss)) {
        el.innerHTML = `파티 DPS : <span class="party-dps-value">-</span>`;
        return;
      }

      const partyDps = getPartyDpsValue();
      if (partyDps === null) {
        el.innerHTML = `파티 DPS : <span class="party-dps-value">-</span>`;
        return;
      }

      el.innerHTML = `파티 DPS : <span class="party-dps-value">${fmtPartyDps(partyDps)}</span>`;
    }

    function renderTable() {
      updateTimeDisplay();

      document.getElementById("contentTitle").textContent = getContentName();
      document.getElementById("tableTitle").textContent = getTableTitle();
      renderTitleMeta();

      if (currentMenu === "gato1750" && !isGato1750Available(currentGato1750Boss)) {
        renderComingSoon(
          `${currentGato1750Boss} 준비중`,
          `해당 보스의 잔영 2단계 데이터는 아직 준비중입니다.<br>현재는 스콜라키아, 크라티오스, 아게오로스가 우선 공개되어 있습니다.`
        );
        document.getElementById("infoHint").innerHTML =
          "1750 가디언 토벌은 일부 보스만 공개되었습니다.<br>준비중 보스는 순차적으로 반영됩니다.";
        updatePartyDpsDisplay();
        return;
      }

      ensureTableWrap();
      renderHead();

      document.getElementById("infoHint").innerHTML =
        "구글 시트 데이터를 읽어 옵니다.";

      const body = document.getElementById("tableBody");
      const totalSeconds = getTotalSeconds();

      if (currentMenu === "gato1730") {
        const rows = parsedData.gato1730[currentGatoBoss] || [];

        if (!rows.length) {
          body.innerHTML = `<tr><td colspan="3">데이터 없음</td></tr>`;
          updatePartyDpsDisplay();
          return;
        }

        body.innerHTML = rows.map(row => {
          let cls = "";
          if (row.share === 30) cls = "row-30";
          if (row.share === 33) cls = "row-33";
          if (row.share === 40) cls = "row-40";

          return `
            <tr class="${cls}">
              ${renderShareCell(row.share)}
              <td>${fmt(row.damage)}</td>
              <td class="dps-cell">${(row.damage / totalSeconds).toFixed(1)}</td>
            </tr>
          `;
        }).join("");

        updatePartyDpsDisplay();
        return;
      }

      if (currentMenu === "gato1750") {
        const rows = parsedData.gato1750[currentGato1750Boss] || [];

        if (!rows.length) {
          body.innerHTML = `<tr><td colspan="3">데이터 없음</td></tr>`;
          updatePartyDpsDisplay();
          return;
        }

        body.innerHTML = rows.map(row => {
          let cls = "";
          if (row.share === 30) cls = "row-30";
          if (row.share === 33) cls = "row-33";
          if (row.share === 40) cls = "row-40";

          return `
            <tr class="${cls}">
              ${renderShareCell(row.share)}
              <td>${fmt(row.damage)}</td>
              <td class="dps-cell">${(row.damage / totalSeconds).toFixed(1)}</td>
            </tr>
          `;
        }).join("");

        updatePartyDpsDisplay();
        return;
      }

      const meta = raidMeta[currentMenu][currentCombo];
      const rows = parsedData[currentMenu]?.[meta.diffKey] || [];

      if (!rows.length) {
        body.innerHTML = `<tr><td colspan="3">데이터 없음</td></tr>`;
        updatePartyDpsDisplay();
        return;
      }

      body.innerHTML = rows.map(row => {
        let cls = "";
        if (row.share === 30) cls = "row-30";
        if (row.share === 33) cls = "row-33";
        if (row.share === 40) cls = "row-40";

        const damage = meta.gateKey === "gate1" ? row.g1 : row.g2;
        const dps = (damage / totalSeconds).toFixed(1);

        return `
          <tr class="${cls}">
            ${renderShareCell(row.share)}
            <td>${fmt(damage)}</td>
            <td class="dps-cell">${dps}</td>
          </tr>
        `;
      }).join("");

      updatePartyDpsDisplay();
    }

    async function loadCSV() {
      document.getElementById("status").textContent = "시트 불러오는 중...";
      try {
        const res = await fetch(CSV_URL);
        const text = await res.text();
        const lines = text.split(/\r?\n/);

        clearAllData();
        parseCathedral(lines);
        parseSerka(lines);
        parseGato1730(lines);
        parseGato1750(lines);

        renderTabs();
        renderTable();
        document.getElementById("status").textContent = "연동 완료";
      } catch (e) {
        console.error(e);
        document.getElementById("status").textContent = "불러오기 실패";
      }
    }

    function changeTimeValue(targetId, delta) {
      const input = document.getElementById(targetId);
      let value = parseInt(input.value || 0, 10);

      if (isNaN(value)) value = 0;
      value += delta;

      if (targetId === "minutes") {
        value = Math.max(0, value);
      }

      if (targetId === "seconds") {
        value = Math.max(0, Math.min(59, value));
      }

      input.value = value;
      renderTable();
    }

    document.querySelectorAll(".menu-item").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".menu-item").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        currentMenu = btn.dataset.menu;

        if (currentMenu === "serka") {
          currentCombo = "hard_gate1";
          trackEvent("/이벤트/메뉴/세르카", "메뉴 클릭 - 세르카");
        } else if (currentMenu === "cathedral") {
          currentCombo = "hard_gate1";
          trackEvent("/이벤트/메뉴/성당", "메뉴 클릭 - 성당");
        } else if (currentMenu === "gato1730") {
          currentGatoBoss = "루멘칼리고";
          trackEvent("/이벤트/메뉴/1730가토", "메뉴 클릭 - 1730 가토");
        } else if (currentMenu === "gato1750") {
          currentGato1750Boss = "스콜라키아";
          trackEvent("/이벤트/메뉴/1750가토", "메뉴 클릭 - 1750 가토");
        }

        setBaseTimeByMenu(currentMenu);
        renderTabs();
        renderTable();
      });
    });

    document.querySelectorAll(".time-step-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const targetId = btn.dataset.stepTarget;
        const step = parseInt(btn.dataset.step, 10);
        changeTimeValue(targetId, step);
      });
    });

    document.getElementById("minutes").addEventListener("input", renderTable);
    document.getElementById("seconds").addEventListener("input", renderTable);

    updateTopDateTime();
    setInterval(updateTopDateTime, 1000);

    setBaseTimeByMenu("serka");
    loadCSV();
  </script>
</body>
</html>
